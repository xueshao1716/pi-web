<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小说工坊 · 小语 AI 工作台</title>
<style>
  :root {
    --bg: #0b0c0f; --panel: #12141a; --panel-2: #1a1d26;
    --border: #262b38; --text: #e6e8ee; --dim: #8a91a5; --dim-2: #5a6070;
    --accent: #8b7cf6; --accent-2: #a394ff; --green: #4ec9b0; --gold: #d4a94e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; min-height: 100vh; }
  .top { display: flex; align-items: center; gap: 12px; padding: 14px 24px; border-bottom: 1px solid var(--border); background: var(--panel); }
  .top a { color: var(--dim); text-decoration: none; font-size: 13px; }
  .top a:hover { color: var(--accent); }
  .top .title { font-size: 15px; font-weight: 700; }
  .top .spacer { flex: 1; }
  .status { font-size: 12px; color: var(--dim-2); }
  .wrap { max-width: 720px; margin: 24px auto; padding: 0 20px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 20px; margin-bottom: 16px; }
  .card h3 { font-size: 14px; margin-bottom: 12px; color: var(--accent-2); }
  label { display: block; font-size: 12px; color: var(--dim); margin: 10px 0 5px; }
  input[type=text], textarea, select {
    width: 100%; background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 10px 12px; font-size: 13px; outline: none; font-family: inherit;
  }
  input:focus, textarea:focus, select:focus { border-color: var(--accent); }
  textarea { min-height: 60px; resize: vertical; }
  .taglist { display: flex; gap: 8px; flex-wrap: wrap; }
  .taglist button { padding: 6px 14px; border: 1px solid var(--border); background: var(--panel-2); color: var(--dim); border-radius: 20px; cursor: pointer; font-size: 12px; }
  .taglist button.on { background: color-mix(in srgb, var(--accent) 25%, transparent); color: var(--text); border-color: var(--accent); }
  .gen-btn {
    width: 100%; padding: 12px; border: none; border-radius: 10px; margin-top: 14px;
    background: var(--accent); color: #0b0c0f; font-size: 14px; font-weight: 700; cursor: pointer;
  }
  .gen-btn:hover { background: var(--accent-2); }
  .gen-btn:disabled { opacity: .5; cursor: not-allowed; }
  #out { margin-top: 16px; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px; font-size: 13px; line-height: 1.7; white-space: pre-wrap; max-height: 400px; overflow-y: auto; }
  .w-login { max-width: 320px; margin: 80px auto; text-align: center; }
  .w-login input { margin-bottom: 10px; }
  .w-login button { width: 100%; padding: 10px; border: none; border-radius: 8px; background: var(--accent); color: #0b0c0f; font-weight: 700; cursor: pointer; }
  .err { color: #ff6b6b; font-size: 12px; margin-top: 8px; }
  .note { font-size: 12px; color: var(--dim-2); margin-top: 8px; }
  .tool { background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; margin: 6px 0; font-size: 12px; }
  .tool .tname { color: var(--accent); font-weight: 600; }
</style>
</head>
<body>
  <div class="top">
    <a href="/workshop">← 专项工坊</a>
    <span class="title">📖 小说工坊</span>
    <span class="spacer"></span>
    <span class="status" id="w-status">…</span>
  </div>

  <div class="w-login" id="w-login" hidden>
    <h2 style="margin-bottom:16px">🔑 连接工作台</h2>
    <input id="w-token-input" type="password" placeholder="访问令牌" autocomplete="off">
    <button id="w-token-go">连接</button>
    <div class="err" id="w-token-err"></div>
  </div>

  <div class="wrap" id="w-scroll" hidden>
    <div class="card">
      <h3>📖 新建小说</h3>
      <label>题材</label>
      <div class="taglist" id="genreTags">
        <button data-genre="xianxia" class="on">玄幻修仙</button>
        <button data-genre="urban">都市</button>
        <button data-genre="scifi">科幻</button>
        <button data-genre="horror">恐怖</button>
      </div>
      <label>书名</label>
      <input type="text" id="novel-title" placeholder="例如：万界修仙">
      <label>主角设定</label>
      <textarea id="novel-protagonist" placeholder="主角身份、性格、金手指（可选，留空由 AI 设计）"></textarea>
      <label>世界背景 / 开头设定</label>
      <textarea id="novel-setting" placeholder="世界观、开局处境（可选，按题材常规设计）"></textarea>
      <label>目标章节数（本次先写第 1 章）</label>
      <input type="number" id="novel-chapters" value="1" min="1" max="10" style="max-width:120px">
      <button class="gen-btn" id="genBtn">📖 开始创作第 1 章</button>
      <div class="note">按 novel-forge v10 流程：建真相文件（防跑偏）→ 5层构建 → 编辑部写作 → 审计。产物存到 工程/小说-<书名>/</div>
    </div>
    <div id="out" hidden></div>
  </div>

<script>
const $ = id => document.getElementById(id);
let token = localStorage.getItem("pi_web_token") || "";
let genre = "xianxia";

async function api(path, opts = {}) {
  const r = await fetch(path, {
    ...opts,
    headers: { "Content-Type": "application/json", Authorization: "Bearer " + token, ...(opts.headers || {}) },
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || r.statusText || "请求失败");
  return data;
}

async function tryLogin() {
  try {
    await api("/api/models");
    localStorage.setItem("pi_web_token", token);
    $("w-login").hidden = true;
    $("w-scroll").hidden = false;
    $("w-status").textContent = "已连接";
  } catch (e) {
    $("w-token-err").textContent = e.status === 401 ? "令牌无效" : "连接失败: " + (e.message || "");
  }
}
if (token) tryLogin();
$("w-token-go").addEventListener("click", () => { token = $("w-token-input").value.trim(); tryLogin(); });

// 题材标签
document.querySelectorAll("#genreTags button").forEach(b => {
  b.addEventListener("click", () => {
    document.querySelectorAll("#genreTags button").forEach(x => x.classList.remove("on"));
    b.classList.add("on");
    genre = b.dataset.genre;
  });
});

// 生成
$("genBtn").addEventListener("click", async () => {
  const title = $("novel-title").value.trim();
  if (!title) { alert("请输入书名"); return; }
  const btn = $("genBtn");
  btn.disabled = true; btn.textContent = "📖 创作中（10 分钟内）…";
  const out = $("out");
  out.hidden = false; out.textContent = "";
  try {
    const r = await fetch("/api/workshop/novel", {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
      body: JSON.stringify({
        genre, title,
        protagonist: $("novel-protagonist").value.trim(),
        setting: $("novel-setting").value.trim(),
        chapters: parseInt($("novel-chapters").value, 10) || 1,
      }),
    });
    if (!r.ok) {
      const e = await r.json().catch(() => ({}));
      out.textContent = "❌ " + (e.error || "请求失败");
      return;
    }
    const reader = r.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split("\n");
      buf = lines.pop();
      for (const line of lines) {
        if (line.startsWith("event: ")) { lastEv = line.slice(7).trim(); continue; }
        if (line.startsWith("data: ")) {
          try {
            const d = JSON.parse(line.slice(6));
            if (lastEv === "note") out.textContent += d.text + "\n";
            else if (lastEv === "delta") out.textContent += d.text;
            else if (lastEv === "tool") out.textContent += "\n🔧 " + (d.name || "") + "\n";
            else if (lastEv === "file") out.textContent += "\n📎 文件: " + (d.name || d.path || "") + "\n";
            out.scrollTop = out.scrollHeight;
          } catch {}
        }
      }
    }
  } catch (e) {
    out.textContent += "\n❌ " + (e.message || e);
  } finally {
    btn.disabled = false; btn.textContent = "📖 开始创作第 1 章";
  }
});
</script>
</body>
</html>
