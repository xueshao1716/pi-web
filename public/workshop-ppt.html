<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📊 PPT 工作室 · 小语</title>
<link rel="icon" href="/static/icon-192.png">
<link rel="stylesheet" href="/static/app.css">
<style>
  /* ═══ PPT 工作室 · 未来感重做版 ═══ */
  body { display: flex; flex-direction: column; height: 100dvh; overflow: hidden;
    background:
      radial-gradient(900px 420px at 85% -10%, color-mix(in srgb, var(--accent) 6%, transparent), transparent 60%),
      var(--bg);
  }
  .w-top {
    display: flex; align-items: center; gap: 12px; padding: 10px 20px;
    border-bottom: 1px solid var(--border);
    background: color-mix(in srgb, var(--bg) 80%, transparent); backdrop-filter: blur(16px);
    flex-shrink: 0; z-index: 10;
  }
  .w-top .back {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
    border-radius: 9px; padding: 6px 14px; font-size: 12.5px; cursor: pointer; text-decoration: none;
    transition: all .15s;
  }
  .w-top .back:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-1px); }
  .w-top .title { font-size: 15px; font-weight: 700; color: var(--text); display: flex; align-items: center; gap: 8px; }
  .w-top .title .t-mark {
    width: 26px; height: 26px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: var(--bg); font-size: 13px;
    box-shadow: 0 0 14px color-mix(in srgb, var(--accent) 35%, transparent);
  }
  .w-top .spacer { flex: 1; }
  .w-top .status {
    font-size: 11.5px; color: var(--dim-2); font-family: var(--mono);
    padding: 4px 10px; border: 1px solid var(--border); border-radius: 999px;
    background: var(--panel); display: flex; align-items: center; gap: 6px;
  }
  .w-top .status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--green); box-shadow: 0 0 6px var(--green); }

  .w-body { flex: 1; display: flex; min-height: 0; }

  /* ── 左栏：参数面板 ── */
  .w-left {
    width: 330px; flex-shrink: 0; border-right: 1px solid var(--border);
    padding: 20px 18px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px;
    background: color-mix(in srgb, var(--bg) 55%, transparent); backdrop-filter: blur(10px);
  }
  .panel-card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    padding: 16px; display: flex; flex-direction: column; gap: 12px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.15);
  }
  .panel-head { display: flex; align-items: center; gap: 8px; }
  .panel-head .ph-ico {
    width: 26px; height: 26px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center;
    background: color-mix(in srgb, var(--accent) 12%, transparent); color: var(--accent); font-size: 13px;
  }
  .panel-head .ph-title { font-size: 13px; font-weight: 700; color: var(--text); }
  .panel-head .ph-sub { font-size: 10.5px; color: var(--dim-2); margin-left: auto; }

  .ws-field { display: flex; flex-direction: column; gap: 6px; }
  .ws-field label { font-size: 11px; color: var(--dim-2); font-weight: 600; letter-spacing: .3px; }
  .ws-field input, .ws-field select {
    width: 100%; box-sizing: border-box; background: var(--panel-2);
    border: 1px solid var(--border); color: var(--text);
    border-radius: 9px; padding: 9px 12px; font-size: 13px; outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  .ws-field input::placeholder { color: var(--dim-2); }
  .ws-field input:focus, .ws-field select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 12%, transparent); }
  .ws-row { display: flex; gap: 10px; }
  .ws-row .ws-field { flex: 1; }

  .ws-go {
    width: 100%; padding: 11px 0; border: none; border-radius: 10px; cursor: pointer;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: var(--bg); font-weight: 700; font-size: 13.5px;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    box-shadow: 0 4px 20px color-mix(in srgb, var(--accent) 30%, transparent);
    transition: all .18s;
  }
  .ws-go:hover:not(:disabled) { transform: translateY(-1px); filter: brightness(1.08); }
  .ws-go:active:not(:disabled) { transform: scale(.97); }
  .ws-go:disabled { opacity: .6; cursor: not-allowed; }
  .ws-tip { font-size: 11px; color: var(--dim-2); line-height: 1.7; padding: 0 2px; }

  /* ── 右区：生成过程时间线 ── */
  .w-right { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .ws-progress-head {
    display: flex; align-items: center; gap: 10px; padding: 14px 22px;
    border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .ws-progress-head .ph-title { font-size: 13px; font-weight: 700; }
  .ws-progress-head .ph-live { font-size: 10.5px; color: var(--dim-2); font-family: var(--mono); margin-left: auto; display: none; }
  .ws-progress-head .ph-live.on { display: inline-flex; align-items: center; gap: 5px; }
  .ws-progress-head .ph-live.on::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--yellow); box-shadow: 0 0 6px var(--yellow); animation: blink 1s infinite; }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .3; } }

  .ws-progress { flex: 1; overflow-y: auto; padding: 16px 22px; display: flex; flex-direction: column; gap: 6px; }
  .ws-empty { color: var(--dim-2); font-size: 13px; padding: 60px 0; text-align: center; line-height: 2; }
  .ws-empty .empty-ico { font-size: 36px; display: block; margin-bottom: 10px; opacity: .6; }

  .ws-log { color: var(--dim); line-height: 1.7; white-space: pre-wrap; word-break: break-word; font-size: 12.5px; padding: 4px 8px; border-radius: 8px; }
  .ws-log.note { color: var(--text); font-weight: 600; background: color-mix(in srgb, var(--accent) 6%, transparent); border: 1px solid color-mix(in srgb, var(--accent) 14%, transparent); }
  .ws-log.ok { color: var(--green); }
  .ws-log.warn { color: var(--yellow); }
  .ws-log.err { color: var(--red); }

  .ws-tool {
    display: flex; align-items: center; gap: 10px; padding: 9px 12px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    animation: toolIn .25s ease both;
  }
  @keyframes toolIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .ws-tool-ico {
    width: 24px; height: 24px; border-radius: 7px; display: inline-flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 12px; color: var(--accent);
    background: color-mix(in srgb, var(--accent) 12%, transparent); flex-shrink: 0;
  }
  .ws-tool.running .ws-tool-ico { animation: spin 1.2s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .ws-tool.ok .ws-tool-ico { color: var(--green); background: color-mix(in srgb, var(--green) 12%, transparent); }
  .ws-tool.err .ws-tool-ico { color: var(--red); background: color-mix(in srgb, var(--red) 12%, transparent); }
  .ws-tool-name { color: var(--accent); font-weight: 700; font-size: 12.5px; flex-shrink: 0; }
  .ws-tool-cmd { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); font-size: 12px; font-family: var(--mono); }
  .ws-tool-state { flex-shrink: 0; font-size: 10.5px; padding: 2px 8px; border-radius: 999px; font-weight: 600; }
  .ws-tool.running .ws-tool-state { color: var(--yellow); background: color-mix(in srgb, var(--yellow) 10%, transparent); }
  .ws-tool.ok .ws-tool-state { color: var(--green); background: color-mix(in srgb, var(--green) 10%, transparent); }
  .ws-tool.err .ws-tool-state { color: var(--red); background: color-mix(in srgb, var(--red) 10%, transparent); }

  /* 产物卡片 */
  .ws-result { border-top: 1px solid var(--border); padding: 14px 22px; flex-shrink: 0; }
  .ws-result-card {
    display: flex; align-items: center; gap: 14px; padding: 14px 16px;
    background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 10%, var(--panel)), var(--panel));
    border: 1px solid color-mix(in srgb, var(--accent) 25%, var(--border));
    border-radius: 14px; box-shadow: 0 4px 24px rgba(0,0,0,0.2);
    animation: toolIn .3s ease both;
  }
  .ws-result-ico {
    width: 42px; height: 42px; border-radius: 11px; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, var(--accent), var(--accent-2)); font-size: 19px; flex-shrink: 0;
    box-shadow: 0 0 16px color-mix(in srgb, var(--accent) 30%, transparent);
  }
  .ws-result-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .ws-result-name { font-size: 13.5px; font-weight: 700; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ws-result-meta { font-size: 11px; color: var(--dim-2); font-family: var(--mono); }
  .ws-result-dl {
    display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: var(--bg);
    border-radius: 9px; font-size: 12.5px; font-weight: 700; text-decoration: none;
    transition: all .15s; flex-shrink: 0;
  }
  .ws-result-dl:hover { transform: translateY(-1px); filter: brightness(1.08); }

  /* 登录卡 */
  .w-login { flex: 1; display: none; align-items: center; justify-content: center; }
  .w-login .card {
    width: 400px; background: var(--panel); border: 1px solid var(--border); border-radius: 18px;
    padding: 38px 32px; box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }
  .w-login .card .lg-mark {
    width: 48px; height: 48px; border-radius: 14px; margin-bottom: 16px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2)); display: flex; align-items: center; justify-content: center;
    font-size: 22px; box-shadow: 0 0 24px color-mix(in srgb, var(--accent) 35%, transparent);
  }
  .w-login .card h2 { font-size: 17px; margin-bottom: 8px; }
  .w-login .card p { font-size: 12.5px; color: var(--dim-2); margin-bottom: 18px; line-height: 1.7; }
  .w-login input {
    width: 100%; box-sizing: border-box; background: var(--panel-2); border: 1px solid var(--border);
    color: var(--text); border-radius: 9px; padding: 11px 13px; font-size: 13px; outline: none; margin-bottom: 10px;
    transition: border-color .15s, box-shadow .15s;
  }
  .w-login input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 12%, transparent); }
  .w-login button {
    width: 100%; padding: 11px 0; border: none; border-radius: 10px; cursor: pointer;
    background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: var(--bg);
    font-weight: 700; font-size: 13.5px; transition: all .18s;
  }
  .w-login button:hover { transform: translateY(-1px); filter: brightness(1.08); }
  .w-login .err { color: var(--red); font-size: 12px; margin-top: 10px; min-height: 16px; }

  /* 移动端 */
  @media (max-width: 768px) {
    .w-body { flex-direction: column; }
    .w-left { width: 100%; border-right: none; border-bottom: 1px solid var(--border); padding: 12px 14px; max-height: 50%; }
    .w-right { width: 100%; }
    .w-top { padding-top: calc(10px + env(safe-area-inset-top)); }
    .w-top .status span { display: none; }
    .ws-progress { padding: 12px 14px; }
    .ws-result { padding: 10px 14px; }
  }
</style>
</head>
<body>

<div class="w-top">
  <a class="back" href="/workshop">← 工作台</a>
  <span class="title"><span class="t-mark">📊</span> PPT 工作室</span>
  <span class="spacer"></span>
  <span class="status" id="w-status">…</span>
</div>

<!-- 登录界面 -->
<div class="w-login" id="w-login">
  <div class="card">
    <div class="lg-mark">📊</div>
    <h2>需要访问令牌</h2>
    <p>输入工作台访问令牌（见服务端 .token 文件），保存后即可使用。</p>
    <input id="w-token-input" type="password" placeholder="访问令牌" autocomplete="off">
    <button id="w-token-go">连接</button>
    <div class="err" id="w-token-err"></div>
  </div>
</div>

<!-- 主界面 -->
<div class="w-body" id="w-main" style="display:none">
  <!-- 左栏：参数 -->
  <div class="w-left">
    <div class="panel-card">
      <div class="panel-head"><span class="ph-ico">⚙</span><span class="ph-title">生成参数</span><span class="ph-sub">七角色协作</span></div>
      <div class="ws-form">
        <div class="ws-field"><label>主题</label><input id="ws-ppt-theme" placeholder="如：AI 时代的智能客服" autocomplete="off"></div>
        <div class="ws-field"><label>目标受众（可选）</label><input id="ws-ppt-audience" placeholder="如：投资人 / 学生 / 管理层" autocomplete="off"></div>
        <div class="ws-row">
          <div class="ws-field"><label>页数</label>
            <select id="ws-ppt-pages"><option value="5">5 页</option><option value="10" selected>10 页</option><option value="15">15 页</option><option value="20">20 页</option></select>
          </div>
          <div class="ws-field"><label>风格</label>
            <select id="ws-ppt-style"><option selected>专业商务</option><option>学术汇报</option><option>简约科技</option><option>创意活泼</option><option>国风典雅</option></select>
          </div>
        </div>
        <button id="ws-ppt-go" class="ws-go">✨ 开始生成</button>
        <div class="ws-tip">生成约需 1-3 分钟：主题 → 模板 → 内容 → 配图 → 润色 → 构建，自动产出 .pptx 保存到「工程」目录</div>
      </div>
    </div>
  </div>

  <!-- 右区：过程 -->
  <div class="w-right">
    <div class="ws-progress-head">
      <span class="ph-title">生成过程</span>
      <span class="ph-live" id="ws-live">LIVE</span>
    </div>
    <div class="ws-progress" id="ws-progress">
      <div class="ws-empty"><span class="empty-ico">✨</span>填写左侧参数，点击「开始生成」<br>七角色协作流程将实时显示在这里</div>
    </div>
    <div class="ws-result" id="ws-result" hidden></div>
  </div>
</div>

<script>
// ══ 主题同步：读取主工作台 localStorage 主题，应用 CSS 变量（与 workshop.html 一致）══
(() => {
  try {
    const key = localStorage.getItem("pi_theme") || "quantum";
    const MAP = { accent:"--accent", accent2:"--accent-2", deep:"--accent-deep", bg:"--bg", sidebar:"--sidebar", panel:"--panel", panel2:"--panel-2", border:"--border", text:"--text", dim:"--dim", dim2:"--dim-2", green:"--green", red:"--red", yellow:"--yellow" };
    const VARS = {
      quantum: { accent:"#23e6ff", accent2:"#6f8bff", deep:"#0d7ff2", bg:"#05070e", sidebar:"#070b16", panel:"#0b1120", panel2:"#0e1628", border:"#1d2b4a", text:"#e8f0ff", dim:"#8ba0c8", dim2:"#47597c" },
      linear: { accent:"#5e6ad2", accent2:"#828fff", deep:"#4c56b0", bg:"#010102", sidebar:"#0f1011", panel:"#141516", panel2:"#18191a", border:"#23252a", text:"#f7f8f8", dim:"#8a8f98", dim2:"#62666d" },
      ops: { accent:"#2596be", accent2:"#4fb8dc", deep:"#1a708f", bg:"#0f1118", sidebar:"#12151d", panel:"#171b25", panel2:"#1c2130", border:"#2a3145", text:"#e4e9f2", dim:"#8b93a8", dim2:"#565f75" },
      apple: { accent:"#0071e3", accent2:"#5aa7f0", deep:"#0055b3", bg:"#f2f5f9", sidebar:"#f8fafc", panel:"#ffffff", panel2:"#eef3f8", border:"#d5dfeb", text:"#1d1d1f", dim:"#6e6e73", dim2:"#a1a1a6" },
    };
    const vars = VARS[key] || VARS.quantum;
    const r = document.documentElement.style;
    for (const [k, v] of Object.entries(MAP)) { if (vars[k]) r.setProperty(v, vars[k]); }
    document.documentElement.dataset.theme = VARS[key] ? key : "quantum";
  } catch {}
})();
// ══ 独立页基础：token + API（页面自身鉴权，服务端 API 仍受保护）══
let token = new URLSearchParams(location.search).get("token") || localStorage.getItem("pi_web_token") || "";
async function api(path, opts = {}) {
  opts.headers = { ...(opts.headers || {}), Authorization: "Bearer " + token };
  if (opts.body && typeof opts.body === "object") { opts.headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(opts.body); }
  const r = await fetch(path, opts);
  const ct = r.headers.get("content-type") || "";
  const data = ct.includes("json") ? await r.json() : null;
  if (!r.ok) { const e = new Error((data && data.error) || "HTTP " + r.status); e.status = r.status; throw e; }
  return data;
}
function esc(s) { return String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function setStatus(t) { const el = document.getElementById("w-status"); if (el) el.textContent = t; }

async function tryConnect() {
  try {
    const d = await api("/api/models");
    document.getElementById("w-login").style.display = "none";
    document.getElementById("w-main").style.display = "flex";
    setStatus("已连接 · " + (d.models?.length || 0) + " 个模型");
    return true;
  } catch {
    document.getElementById("w-login").style.display = "flex";
    document.getElementById("w-main").style.display = "none";
    setStatus("未授权");
    return false;
  }
}
document.getElementById("w-token-go").addEventListener("click", async () => {
  const v = document.getElementById("w-token-input").value.trim();
  if (!v) return;
  token = v;
  localStorage.setItem("pi_web_token", v);
  const ok = await tryConnect();
  document.getElementById("w-token-err").textContent = ok ? "" : "令牌无效，请重试";
});
document.getElementById("w-token-input").addEventListener("keydown", (e) => { if (e.key === "Enter") document.getElementById("w-token-go").click(); });
tryConnect();

// ══ 生成过程渲染 ══
const wsLog = (text, cls = "") => {
  const box = document.getElementById("ws-progress");
  if (box.querySelector(".ws-empty")) box.innerHTML = "";
  const el = document.createElement("div");
  el.className = "ws-log" + (cls ? " " + cls : "");
  el.textContent = text;
  box.appendChild(el);
  box.scrollTop = box.scrollHeight;
};

// ══ PPT 生成（SSE 流式）══
document.getElementById("ws-ppt-go").addEventListener("click", async () => {
  const theme = document.getElementById("ws-ppt-theme").value.trim();
  if (!theme) { document.getElementById("ws-ppt-theme").focus(); return; }
  const body = {
    theme,
    pages: parseInt(document.getElementById("ws-ppt-pages").value, 10) || 10,
    style: document.getElementById("ws-ppt-style").value,
    audience: document.getElementById("ws-ppt-audience").value.trim(),
  };
  const go = document.getElementById("ws-ppt-go");
  go.disabled = true;
  go.textContent = "⏳ 生成中…";
  document.getElementById("ws-progress").innerHTML = "";
  document.getElementById("ws-result").hidden = true;
  document.getElementById("ws-result").innerHTML = "";
  document.getElementById("ws-live").classList.add("on");
  try {
    const r = await fetch("/api/workshop/ppt", {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
      body: JSON.stringify(body),
    });
    if (!r.ok) {
      const e = await r.json().catch(() => ({}));
      wsLog("❌ " + (e.error || "请求失败"), "err");
      document.getElementById("ws-live").classList.remove("on");
      return;
    }
    const reader = r.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value || new Uint8Array(), { stream: !done });
      let idx;
      while ((idx = buf.indexOf("\n\n")) !== -1) {
        const chunk = buf.slice(0, idx); buf = buf.slice(idx + 2);
        const line = chunk.split("\n").find(l => l.startsWith("data: "));
        if (!line) continue;
        let ev;
        try { ev = JSON.parse(line.slice(6)); } catch { continue; }
        if (ev.text !== undefined) {
          if (ev.text.startsWith("📊") || ev.text.startsWith("🧠")) wsLog(ev.text, "note");
          else if (ev.text.startsWith("✅") || ev.text.startsWith("⚠")) wsLog(ev.text, ev.text.startsWith("✅") ? "ok" : "warn");
        } else if (ev.name !== undefined && ev.args !== undefined && ev.id !== undefined) {
          const cmd = ev.args?.command || ev.args?.path || JSON.stringify(ev.args || "").slice(0, 60);
          const div = document.createElement("div");
          div.className = "ws-tool running";
          div.dataset.tid = ev.id;
          div.innerHTML = `<span class="ws-tool-ico">⟳</span><span class="ws-tool-name">${esc(ev.name)}</span><span class="ws-tool-cmd">${esc(String(cmd))}</span><span class="ws-tool-state">运行中</span>`;
          document.getElementById("ws-progress").appendChild(div);
          document.getElementById("ws-progress").scrollTop = document.getElementById("ws-progress").scrollHeight;
        } else if (ev.id !== undefined && ev.name !== undefined && "isError" in ev) {
          const el = document.querySelector(`.ws-tool[data-tid="${ev.id}"]`);
          if (el) {
            el.classList.remove("running");
            el.classList.add(ev.isError ? "err" : "ok");
            const ico = el.querySelector(".ws-tool-ico");
            ico.textContent = ev.isError ? "✕" : "✓";
            const st = el.querySelector(".ws-tool-state");
            st.textContent = ev.isError ? "失败" : "完成";
          }
        } else if (ev.file) {
          const f = ev.file;
          const url = "/api/ws/file?path=" + encodeURIComponent(f.path) + "&download=1";
          const res = document.getElementById("ws-result");
          res.hidden = false;
          res.innerHTML = `
            <div class="ws-result-card">
              <span class="ws-result-ico">📊</span>
              <span class="ws-result-info"><span class="ws-result-name">${esc(f.name)}</span><span class="ws-result-meta">${(f.size / 1024).toFixed(0)} KB · PPTX</span></span>
              <a class="ws-result-dl" href="${url}" download>⬇ 下载</a>
            </div>`;
        } else if (ev.ok !== undefined && "file" in ev) {
          wsLog(ev.ok ? "🎉 完成" : "⚠️ 未检测到产物", ev.ok ? "ok" : "warn");
        } else if (ev.message !== undefined) {
          wsLog("❌ " + ev.message, "err");
        }
      }
    }
  } catch (e) {
    wsLog("❌ 连接中断: " + (e.message || e), "err");
  } finally {
    go.disabled = false;
    go.textContent = "✨ 开始生成";
    document.getElementById("ws-live").classList.remove("on");
  }
});
</script>
</body>
</html>
