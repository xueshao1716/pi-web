<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✏️ 页面设计器 · 小语</title>
<link rel="icon" href="/static/icon-192.png">
<link rel="stylesheet" href="/static/app.css">
<style>
  body { display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
  .w-top { display: flex; align-items: center; gap: 12px; padding: 10px 18px; border-bottom: 1px solid var(--border); background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: blur(12px); flex-shrink: 0; }
  .w-top .back { background: var(--panel-2); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 6px 12px; font-size: 12.5px; cursor: pointer; text-decoration: none; }
  .w-top .back:hover { border-color: var(--accent); color: var(--accent); }
  .w-top .title { font-size: 15px; font-weight: 700; color: var(--text); }
  .w-top .spacer { flex: 1; }
  .w-top .status { font-size: 11.5px; color: var(--dim-2); font-family: var(--mono); }
  .dg-status { font-size: 11.5px; color: var(--dim); font-weight: 400; }
  .w-main { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .dg-toolbar { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .dg-toolbar input { flex: 1; min-width: 220px; background: var(--panel-2); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 8px 12px; font-size: 12.5px; outline: none; }
  .dg-toolbar input:focus { border-color: var(--accent); }
  .dg-btn { background: var(--panel-2); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 7px 13px; font-size: 12px; cursor: pointer; transition: border-color .12s, color .12s; }
  .dg-btn:hover { border-color: var(--accent); color: var(--accent); }
  .dg-btn.dg-ai-go { background: linear-gradient(135deg, var(--accent), var(--accent-deep)); border: none; color: #0b0c0f; font-weight: 700; }
  .dg-btn.dg-ai-go:disabled { opacity: .6; cursor: not-allowed; }
  .dg-btn.dg-apply { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, var(--border)); }
  .dg-sep { width: 1px; height: 18px; background: var(--border); }
  .dg-body { flex: 1; display: flex; min-height: 0; }
  .dg-left { width: 190px; flex-shrink: 0; border-right: 1px solid var(--border); overflow-y: auto; padding: 12px; }
  .dg-panel-title { font-size: 11px; font-weight: 700; color: var(--accent); letter-spacing: .5px; margin-bottom: 8px; }
  .dg-hint { font-weight: 400; color: var(--dim-2); }
  .dg-comp { display: flex; align-items: center; gap: 8px; padding: 7px 9px; border-radius: 7px; cursor: grab; font-size: 12.5px; border: 1px solid transparent; }
  .dg-comp:hover { background: var(--panel-2); border-color: var(--border); }
  .dg-comp .dg-ico { font-size: 14px; }
  .dg-tree-item { display: flex; align-items: center; gap: 6px; padding: 5px 8px; border-radius: 6px; font-size: 11.5px; color: var(--dim); cursor: pointer; }
  .dg-tree-item:hover { background: var(--panel-2); }
  .dg-tree-item.selected { background: color-mix(in srgb, var(--accent) 12%, transparent); color: var(--accent); }
  .dg-canvas-wrap { flex: 1; overflow: auto; background: radial-gradient(600px 300px at 50% 0%, color-mix(in srgb, var(--accent) 3%, transparent), transparent), var(--bg); padding: 24px; }
  .dg-canvas { max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; min-height: 60%; }
  .dg-canvas[hidden] { display: none; }
  .dg-node { position: relative; border: 1px dashed transparent; border-radius: 10px; padding: 4px; transition: border-color .12s; }
  .dg-node:hover { border-color: var(--border); }
  .dg-node.selected { border-color: var(--accent); }
  .dg-node .dg-tag { position: absolute; top: -9px; left: 10px; font-size: 10px; color: var(--accent); background: var(--panel-2); border: 1px solid var(--border); padding: 0 8px; border-radius: 6px; z-index: 3; }
  .dg-node .dg-del { position: absolute; top: -9px; right: 10px; width: 20px; height: 20px; border-radius: 6px; background: var(--red); border: none; color: #fff; font-size: 10px; cursor: pointer; z-index: 3; opacity: 0; transition: opacity .12s; }
  .dg-node:hover .dg-del { opacity: 1; }
  .dg-ai-preview { max-width: 860px; margin: 0 auto; height: 70%; }
  .dg-ai-preview iframe { width: 100%; height: 100%; border: 1px solid var(--border); border-radius: 12px; background: #fff; }
  .dg-ai-preview[hidden] { display: none; }
  .dg-right { width: 240px; flex-shrink: 0; border-left: 1px solid var(--border); overflow-y: auto; padding: 12px; }
  .dg-props .dg-empty { color: var(--dim-2); font-size: 12px; text-align: center; padding: 30px 8px; line-height: 1.8; }
  .dg-field { margin-bottom: 10px; }
  .dg-field label { display: block; font-size: 11px; color: var(--dim-2); margin-bottom: 4px; }
  .dg-field input[type="text"], .dg-field input[type="number"], .dg-field select, .dg-field textarea {
    width: 100%; background: var(--panel-2); border: 1px solid var(--border); border-radius: 6px;
    padding: 6px 8px; color: var(--text); font-size: 12px; outline: none; box-sizing: border-box;
  }
  .dg-field textarea { resize: vertical; min-height: 50px; font-family: var(--mono); }
  .dg-field input[type="color"] { width: 36px; height: 28px; border: 1px solid var(--border); border-radius: 6px; background: var(--panel-2); cursor: pointer; padding: 0; }
  .dg-field input:focus, .dg-field select:focus, .dg-field textarea:focus { border-color: var(--accent); }
  /* 登录界面 */
  .w-login { flex: 1; display: none; align-items: center; justify-content: center; }
  .w-login .card { width: 380px; background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 36px 30px; }
  .w-login .card h2 { font-size: 16px; margin-bottom: 8px; }
  .w-login .card p { font-size: 12.5px; color: var(--dim-2); margin-bottom: 16px; }
  .w-login input { width: 100%; box-sizing: border-box; background: var(--panel-2); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 10px 12px; font-size: 13px; outline: none; margin-bottom: 10px; }
  .w-login input:focus { border-color: var(--accent); }
  .w-login button { width: 100%; padding: 10px 0; border: none; border-radius: 8px; background: var(--accent); color: #0b0c0f; font-weight: 700; cursor: pointer; font-size: 13px; }
  .w-login .err { color: var(--red); font-size: 12px; margin-top: 10px; min-height: 16px; }
</style>
</head>
<body>

<div class="w-top">
  <a class="back" href="/workshop">← 工作台</a>
  <span class="title">✏️ 页面设计器</span>
  <span id="dg-status" class="dg-status"></span>
  <span class="spacer"></span>
  <span class="status" id="w-status">…</span>
</div>

<!-- 登录界面 -->
<div class="w-login" id="w-login">
  <div class="card">
    <h2>需要访问令牌</h2>
    <p>输入工作台访问令牌（见服务端 .token 文件），保存后即可使用。</p>
    <input id="w-token-input" type="password" placeholder="访问令牌" autocomplete="off">
    <button id="w-token-go">连接</button>
    <div class="err" id="w-token-err"></div>
  </div>
</div>

<!-- 设计器主界面 -->
<div class="w-main" id="w-main" style="display:none">
  <div class="dg-toolbar">
    <input id="dg-ai-input" placeholder="🎨 描述你的页面：如「深色科技风产品介绍页，含导航栏和 Hero 区」…" autocomplete="off">
    <button class="dg-btn dg-ai-go" id="dg-ai-go">✨ AI 生成</button>
    <button class="dg-btn" id="dg-expand-btn" title="AI 结果放大预览">🔎</button>
    <span class="dg-sep"></span>
    <button class="dg-btn" id="dg-clear">🗑 清空</button>
    <button class="dg-btn" id="dg-desc">🧩 生成设计说明</button>
    <button class="dg-btn dg-apply" id="dg-export">⬇ 导出 HTML</button>
    <button class="dg-btn dg-apply" id="dg-apply">📦 保存到项目</button>
  </div>
  <div class="dg-body">
    <div class="dg-left">
      <div class="dg-panel-title">🧩 组件库 <span class="dg-hint">拖到画布</span></div>
      <div id="dg-components"></div>
      <div class="dg-panel-title" style="margin-top:14px">📋 页面结构</div>
      <div id="dg-tree"></div>
    </div>
    <div class="dg-canvas-wrap">
      <div class="dg-canvas" id="dg-canvas"></div>
      <div class="dg-ai-preview" id="dg-ai-preview" hidden></div>
    </div>
    <div class="dg-right">
      <div class="dg-panel-title">⚙ 属性</div>
      <div id="dg-props" class="dg-props">
        <div class="dg-empty">点击画布中的组件编辑属性<br>或拖入组件开始设计</div>
      </div>
    </div>
  </div>
</div>

<script>
// ══ 独立页基础：token + API + 基础工具（页面自鉴权）══
let token = new URLSearchParams(location.search).get("token") || localStorage.getItem("pi_web_token") || "";
const $ = id => document.getElementById(id);
async function api(path, opts = {}) {
  opts.headers = { ...(opts.headers || {}), Authorization: "Bearer " + token };
  if (opts.body && typeof opts.body === "object") { opts.headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(opts.body); }
  const r = await fetch(path, opts);
  const ct = r.headers.get("content-type") || "";
  const data = ct.includes("json") ? await r.json() : null;
  if (!r.ok) { const e = new Error((data && data.error) || "HTTP " + r.status); e.status = r.status; throw e; }
  return data;
}
function esc(s) { return String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
let toastTimer = null;
function toast(msg) {
  let t = $("dg-toast");
  if (!t) {
    t = document.createElement("div");
    t.id = "dg-toast";
    t.style.cssText = "position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--panel-2);border:1px solid var(--border);border-radius:10px;padding:10px 18px;font-size:13px;color:var(--text);z-index:400;box-shadow:0 10px 30px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .25s";
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity = "1";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.style.opacity = "0", 2200);
}
function appPrompt(msg, def = "", title = "输入") {
  return new Promise((resolve) => {
    const v = window.prompt(title + "：" + msg, def);
    resolve(v);
  });
}
function setStatus(t) { const el = $("w-status"); if (el) el.textContent = t; }
async function tryConnect() {
  try {
    const d = await api("/api/models");
    $("w-login").style.display = "none";
    $("w-main").style.display = "flex";
    setStatus("已连接 · " + (d.models?.length || 0) + " 个模型");
    dgInitComponents();
    dgRenderAll();
    return true;
  } catch {
    $("w-login").style.display = "flex";
    $("w-main").style.display = "none";
    setStatus("未授权");
    return false;
  }
}
$("w-token-go").addEventListener("click", async () => {
  const v = $("w-token-input").value.trim();
  if (!v) return;
  token = v;
  localStorage.setItem("pi_web_token", v);
  const ok = await tryConnect();
  $("w-token-err").textContent = ok ? "" : "令牌无效，请重试";
});
$("w-token-input").addEventListener("keydown", (e) => { if (e.key === "Enter") $("w-token-go").click(); });
tryConnect();

// ══ 可视化页面设计器（独立页版，逻辑与原 designer.js 一致）══
const DG_COMPONENTS = [
  { type: "navbar", label: "导航栏", icon: "🧭", props: { brand: "我的网站", links: "首页 关于 联系", bg: "#1a1e2a", color: "#e8eaf2" } },
  { type: "hero", label: "Hero 区", icon: "🚀", props: { title: "欢迎来到我的网站", subtitle: "这是副标题，介绍你的产品亮点", btn: "开始使用", bg: "linear-gradient(135deg,#1a1e2a,#2a2340)" } },
  { type: "heading", label: "标题", icon: "🅷", props: { text: "这是一个标题", level: 2, size: 26, color: "#e8eaf2", align: "left" } },
  { type: "text", label: "文本", icon: "📝", props: { text: "这是一段文本内容，可以自由编辑。", size: 15, color: "#aab", align: "left" } },
  { type: "button", label: "按钮", icon: "🔘", props: { text: "点击按钮", bg: "#7c5cff", color: "#fff", size: 15, radius: 8 } },
  { type: "image", label: "图片", icon: "🖼", props: { src: "", alt: "图片", h: 160, bg: "linear-gradient(135deg,#2a2d3a,#1a1e2a)", radius: 10 } },
  { type: "card", label: "卡片", icon: "🃏", props: { title: "卡片标题", text: "卡片内容，支持多行文字。", bg: "#161a24", radius: 12 } },
  { type: "input", label: "输入框", icon: "⌨", props: { label: "", placeholder: "请输入…" } },
  { type: "list", label: "列表", icon: "📋", props: { items: "项目一\n项目二\n项目三" } },
  { type: "footer", label: "页脚", icon: "👣", props: { text: "© 2025 我的网站" } },
];
let dgNodes = [];
let dgSelectedId = null;
let dgLastAiHtml = "";
const dgStatus = (t) => $("dg-status").textContent = t ? "· " + t : "";

function dgInitComponents() {
  const box = $("dg-components");
  box.innerHTML = "";
  for (const c of DG_COMPONENTS) {
    const el = document.createElement("div");
    el.className = "dg-comp";
    el.draggable = true;
    el.innerHTML = `<span class="dg-ico">${c.icon}</span>${c.label}`;
    el.addEventListener("dragstart", (e) => e.dataTransfer.setData("text/plain", c.type));
    box.appendChild(el);
  }
}

function dgNodeHtml(node) {
  const p = node.props || {};
  const css = (o) => Object.entries(o).filter(([, v]) => v !== undefined && v !== null && v !== "").map(([k, v]) => `${k}:${v}`).join(";");
  switch (node.type) {
    case "navbar": return `<div style="${css({"display":"flex","justify-content":"space-between","align-items":"center","background":p.bg,"padding":"10px 16px","border-radius":"10px","color":p.color,"font-weight":"600"})}"><span>${esc(p.brand || "我的网站")}</span><span style="font-size:12px;opacity:.7">${esc(p.links || "首页 关于 联系")}</span></div>`;
    case "hero": return `<div style="${css({"background":p.bg,"padding":"40px 24px","border-radius":"14px","text-align":"center","color":"#fff"})}"><h1 style="margin:0 0 8px;font-size:28px">${esc(p.title || "欢迎来到我的网站")}</h1><p style="margin:0 0 16px;color:rgba(255,255,255,.7);font-size:14px">${esc(p.subtitle || "这是副标题")}</p><button style="background:#7c5cff;border:none;color:#fff;padding:10px 22px;border-radius:8px;cursor:pointer;font-size:14px">${esc(p.btn || "开始使用")}</button></div>`;
    case "heading": return `<h${p.level || 2} style="${css({"color":p.color,"font-size":(p.size || 26) + "px","text-align":p.align,"margin":"0"})}">${esc(p.text || "标题")}</h${p.level || 2}>`;
    case "text": return `<p style="${css({"color":p.color,"font-size":(p.size || 15) + "px","text-align":p.align,"margin":"0"})}">${esc(p.text || "文本")}</p>`;
    case "button": return `<button style="${css({"background":p.bg,"color":p.color,"font-size":(p.size || 15) + "px","border-radius":p.radius + "px","border":"none","padding":"10px 20px","cursor":"pointer"})}">${esc(p.text || "按钮")}</button>`;
    case "image": return p.src
      ? `<img src="${esc(p.src)}" style="width:100%;height:${p.h || 160}px;object-fit:cover;border-radius:${p.radius || 10}px">`
      : `<div style="${css({"height":(p.h || 160) + "px","background":p.bg,"border-radius":p.radius + "px","display":"flex","align-items":"center","justify-content":"center","color":"#667","font-size":"12px"})}">🖼 ${esc(p.alt || "图片占位")}（在属性里填 URL）</div>`;
    case "card": return `<div style="${css({"background":p.bg,"border-radius":p.radius + "px","padding":"16px","border":"1px solid rgba(255,255,255,.06)"})}"><h3 style="margin:0 0 6px;color:#e8eaf2;font-size:16px">${esc(p.title || "卡片标题")}</h3><p style="margin:0;color:#aab;font-size:13px">${esc(p.text || "卡片内容")}</p></div>`;
    case "input": return `<div><label style="font-size:12px;color:#aab;display:block;margin-bottom:4px">${esc(p.label || "")}</label><input placeholder="${esc(p.placeholder || "请输入…")}" style="width:100%;background:#0d0f16;border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:9px 12px;color:#e8eaf2;font-size:13px;outline:none"></div>`;
    case "list": return `<ul style="margin:0;padding-left:18px;color:#aab;font-size:14px">${String(p.items || "项目一\n项目二").split("\n").map(i => `<li>${esc(i)}</li>`).join("")}</ul>`;
    case "footer": return `<div style="${css({"text-align":"center","color":"#667","font-size":"12px","padding":"12px","border-top":"1px solid rgba(255,255,255,.06)"})}">${esc(p.text || "© 2025 我的网站")}</div>`;
    default: return `<div>${esc(node.type)}</div>`;
  }
}

function dgRenderAll() {
  const canvas = $("dg-canvas");
  canvas.hidden = false;
  $("dg-ai-preview").hidden = true;
  canvas.innerHTML = "";
  if (!dgNodes.length) {
    canvas.innerHTML = '<div style="color:#556;font-size:13px;text-align:center;padding:50px 20px;line-height:2">🖐 从左侧拖入组件开始设计<br>或在上方输入描述用 ✨ AI 生成整页<br><br>设计完点 <b>📦 保存到项目</b> 存到工程目录<br>点 <b>🔎</b> 可放大查看 AI 结果</div>';
    dgRenderTree();
    return;
  }
  dgNodes.forEach((node) => canvas.appendChild(dgRenderNode(node)));
  dgRenderTree();
}

function dgRenderNode(node) {
  const wrap = document.createElement("div");
  wrap.className = "dg-node" + (node.id === dgSelectedId ? " selected" : "");
  wrap.dataset.id = node.id;
  wrap.draggable = true;
  const label = DG_COMPONENTS.find(c => c.type === node.type)?.label || node.type;
  wrap.innerHTML = `<span class="dg-tag">${label}</span>${dgNodeHtml(node)}<button class="dg-del">✕</button>`;
  wrap.addEventListener("click", (e) => {
    if (e.target.classList.contains("dg-del")) return;
    dgSelectedId = node.id;
    dgRenderAll();
    dgRenderProps();
  });
  wrap.querySelector(".dg-del").addEventListener("click", (e) => {
    e.stopPropagation();
    dgNodes = dgNodes.filter(n => n.id !== node.id);
    dgSelectedId = null;
    dgRenderAll();
    dgRenderProps();
  });
  wrap.addEventListener("dragstart", (e) => e.dataTransfer.setData("text/plain", node.id));
  return wrap;
}

$("dg-canvas").addEventListener("dragover", (e) => e.preventDefault());
$("dg-canvas").addEventListener("drop", (e) => {
  e.preventDefault();
  const type = e.dataTransfer.getData("text/plain");
  if (!type) return;
  const existing = dgNodes.find(n => n.id === type);
  let added = false;
  if (existing) {
    dgNodes = dgNodes.filter(n => n.id !== existing.id);
    dgNodes.push(existing);
    added = true;
  } else {
    const def = DG_COMPONENTS.find(c => c.type === type);
    if (def) {
      dgNodes.push({ id: "n" + Date.now() + Math.floor(Math.random() * 999), type, props: { ...def.props } });
      added = true;
    }
  }
  if (added) { dgStatus("组件已添加/移动"); dgRenderAll(); }
});

function dgRenderTree() {
  const box = $("dg-tree");
  box.innerHTML = "";
  if (!dgNodes.length) { box.innerHTML = '<div class="dg-empty" style="color:#556;font-size:11px;padding:6px">画布为空</div>'; return; }
  dgNodes.forEach((node, i) => {
    const el = document.createElement("div");
    el.className = "dg-tree-item" + (node.id === dgSelectedId ? " selected" : "");
    const label = DG_COMPONENTS.find(c => c.type === node.type)?.label || node.type;
    el.innerHTML = `<span>${i + 1}.</span> ${DG_COMPONENTS.find(c => c.type === node.type)?.icon || "📄"} ${label}`;
    el.addEventListener("click", () => { dgSelectedId = node.id; dgRenderAll(); dgRenderProps(); });
    box.appendChild(el);
  });
}

const DG_FIELD_DEFS = {
  navbar: [{ key: "brand", label: "站点名", type: "text" }, { key: "links", label: "链接（空格分隔）", type: "text" }, { key: "bg", label: "背景色", type: "color" }, { key: "color", label: "文字色", type: "color" }],
  hero: [{ key: "title", label: "主标题", type: "text" }, { key: "subtitle", label: "副标题", type: "text" }, { key: "btn", label: "按钮文字", type: "text" }, { key: "bg", label: "背景（颜色/渐变）", type: "text" }],
  heading: [{ key: "text", label: "文本", type: "text" }, { key: "level", label: "级别", type: "select", options: [1, 2, 3] }, { key: "size", label: "字号", type: "number" }, { key: "color", label: "颜色", type: "color" }, { key: "align", label: "对齐", type: "select", options: ["left", "center", "right"] }],
  text: [{ key: "text", label: "文本", type: "textarea" }, { key: "size", label: "字号", type: "number" }, { key: "color", label: "颜色", type: "color" }, { key: "align", label: "对齐", type: "select", options: ["left", "center", "right"] }],
  button: [{ key: "text", label: "按钮文字", type: "text" }, { key: "bg", label: "背景色", type: "color" }, { key: "color", label: "文字色", type: "color" }, { key: "size", label: "字号", type: "number" }, { key: "radius", label: "圆角", type: "number" }],
  image: [{ key: "src", label: "图片 URL", type: "text" }, { key: "alt", label: "占位文字", type: "text" }, { key: "h", label: "高度", type: "number" }, { key: "radius", label: "圆角", type: "number" }],
  card: [{ key: "title", label: "标题", type: "text" }, { key: "text", label: "内容", type: "textarea" }, { key: "bg", label: "背景色", type: "color" }, { key: "radius", label: "圆角", type: "number" }],
  input: [{ key: "label", label: "标签", type: "text" }, { key: "placeholder", label: "占位文字", type: "text" }],
  list: [{ key: "items", label: "项目（每行一个）", type: "textarea" }],
  footer: [{ key: "text", label: "页脚文字", type: "text" }],
};
function dgRenderProps() {
  const box = $("dg-props");
  const node = dgNodes.find(n => n.id === dgSelectedId);
  if (!node) { box.innerHTML = '<div class="dg-empty">点击画布中的组件编辑属性<br>或拖入组件开始设计</div>'; return; }
  const def = DG_COMPONENTS.find(c => c.type === node.type);
  const fields = DG_FIELD_DEFS[node.type] || [];
  let html = `<div class="dg-panel-title">${def.icon} ${def.label}</div>`;
  for (const f of fields) {
    const v = node.props[f.key] ?? "";
    if (f.type === "select") html += `<div class="dg-field"><label>${f.label}</label><select data-key="${f.key}">${f.options.map(o => `<option ${String(o) === String(v) ? "selected" : ""}>${o}</option>`).join("")}</select></div>`;
    else if (f.type === "textarea") html += `<div class="dg-field"><label>${f.label}</label><textarea data-key="${f.key}">${esc(String(v))}</textarea></div>`;
    else if (f.type === "color") html += `<div class="dg-field"><label>${f.label}</label><input type="color" data-key="${f.key}" value="${/^#[0-9a-fA-F]{3,8}$/.test(String(v)) ? v : "#7c5cff"}"><span style="font-size:11px;color:var(--dim-2);margin-left:6px">${esc(String(v))}</span></div>`;
    else html += `<div class="dg-field"><label>${f.label}</label><input type="${f.type}" data-key="${f.key}" value="${esc(String(v))}"></div>`;
  }
  html += `<button class="dg-btn" id="dg-del-node" style="width:100%;margin-top:8px">🗑 删除该组件</button>`;
  box.innerHTML = html;
  box.querySelectorAll("input, select, textarea").forEach((el) => {
    el.addEventListener("input", (e) => {
      const key = e.target.dataset.key;
      let v = e.target.value;
      if (e.target.type === "number") v = parseFloat(v) || 0;
      node.props[key] = v;
      dgRenderAll();
      dgRenderProps();
    });
  });
  box.querySelector("#dg-del-node").addEventListener("click", () => {
    dgNodes = dgNodes.filter(n => n.id !== node.id);
    dgSelectedId = null;
    dgRenderAll(); dgRenderProps();
  });
}

// AI 生成
$("dg-ai-go").addEventListener("click", async () => {
  const prompt = $("dg-ai-input").value.trim();
  if (!prompt) return toast("请输入页面描述");
  dgStatus("AI 生成中…");
  $("dg-ai-go").disabled = true;
  try {
    const r = await api("/api/designer/generate", { method: "POST", body: { prompt } });
    if (r.html) {
      dgLastAiHtml = r.html;
      dgShowAiPreview(r.html);
      dgStatus("AI 预览生成 ✓");
    } else toast("生成失败: " + (r.error || ""));
  } catch { toast("AI 生成失败"); }
  $("dg-ai-go").disabled = false;
});
function dgShowAiPreview(html) {
  $("dg-canvas").hidden = true;
  const pv = $("dg-ai-preview");
  pv.hidden = false;
  pv.innerHTML = "";
  const iframe = document.createElement("iframe");
  iframe.src = URL.createObjectURL(new Blob([html], { type: "text/html" }));
  pv.appendChild(iframe);
}
$("dg-expand-btn").addEventListener("click", () => {
  if ($("dg-ai-preview").hidden) return toast("先 ✨ AI 生成一个页面");
  const src = $("dg-ai-preview").querySelector("iframe")?.src;
  if (src) window.open(src, "_blank");
});

// 导出 / 保存
function dgExportHtml() {
  const body = dgNodes.map(n => dgNodeHtml(n)).join("\n");
  return `<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的页面</title><style>body{background:#12141c;color:#e8eaf2;font-family:system-ui,-apple-system,sans-serif;margin:0;padding:24px 16px}body>div,body>p,body>h1,body>h2,body>h3,body>button,body>ul,body>img{max-width:860px;margin-left:auto;margin-right:auto;display:block}body>*+*{margin-top:14px}</style></head><body>${body}</body></html>`;
}
function dgBuildDesignDoc() {
  if (!dgNodes.length) return null;
  const lines = [];
  lines.push("# 页面设计说明（由可视化设计器生成）");
  lines.push("");
  lines.push("以下是我的页面结构设计，请基于此生成完整的 HTML 页面。注意：这是设计意图，你可以自由优化样式、布局细节，使其更精致专业。");
  lines.push("");
  lines.push("## 页面结构（从上到下）");
  lines.push("");
  dgNodes.forEach((n, i) => {
    const def = DG_COMPONENTS.find(c => c.type === n.type);
    const label = def?.label || n.type;
    const icon = def?.icon || "📄";
    lines.push(`${i + 1}. ${icon} **${label}**`);
    const fields = DG_FIELD_DEFS[n.type] || [];
    for (const f of fields) {
      const v = n.props?.[f.key];
      if (v === undefined || v === null || v === "") continue;
      lines.push(`   - ${f.label}：${String(v).replace(/\n/g, " / ")}`);
    }
  });
  lines.push("");
  lines.push("请输出：完整可用的 HTML 文件（含样式），视觉要精致、配色统一、响应式友好。");
  return lines.join("\n");
}
$("dg-desc").addEventListener("click", () => {
  const doc = dgBuildDesignDoc();
  if (!doc) return toast("画布为空，先拖入组件或 AI 生成");
  navigator.clipboard.writeText(doc).then(() => {
    toast("✅ 设计说明已复制，可直接粘贴给 AI");
    dgStatus("设计说明已复制");
  }).catch(() => toast("复制失败，请手动选择"));
});
$("dg-export").addEventListener("click", () => {
  const html = dgExportHtml();
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([html], { type: "text/html" }));
  a.download = "page.html";
  a.click();
  toast("已导出 page.html");
});
$("dg-apply").addEventListener("click", async () => {
  const html = $("dg-ai-preview").hidden ? dgExportHtml() : dgLastAiHtml;
  if (!html) return toast("没有可保存的内容");
  const project = await appPrompt("保存到哪个项目？（工程目录下，新项目名会自动创建）", "my-page", "保存");
  if (!project) return;
  try {
    const r = await api("/api/designer/save", { method: "POST", body: { project, filename: "index.html", html } });
    if (r.ok) { toast("✅ 已保存到 " + r.path); dgStatus("已保存 → " + r.path); }
    else toast("保存失败: " + (r.error || ""));
  } catch { toast("保存失败"); }
});
$("dg-clear").addEventListener("click", async () => {
  if (!dgNodes.length && $("dg-ai-preview").hidden) return;
  if (!window.confirm("清空画布？")) return;
  dgNodes = []; dgSelectedId = null; dgLastAiHtml = "";
  $("dg-canvas").hidden = false; $("dg-ai-preview").hidden = true;
  dgRenderAll(); dgRenderProps();
  dgStatus("");
});
</script>
</body>
</html>
