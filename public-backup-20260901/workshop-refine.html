<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📝 经验沉淀台 · 小语</title>
<link rel="icon" href="/static/icon-192.png">
<link rel="stylesheet" href="/static/app.css">
<style>
  :root {
    --ink: #e6e8ee; --paper: #0b0c0f; --card: #14161d; --gold: #b08d4a;
    --line: #262b38; --dim: #8a91a5; --teal: #3ecf8e; --red: #f47067;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background: var(--paper); color: var(--ink); font-family:'Noto Sans SC',sans-serif; min-height:100vh; overflow-y:auto; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 24px 20px 80px; }

  header { text-align:center; padding: 14px 0 20px; border-bottom:1px solid var(--line); margin-bottom: 20px; position:relative; }
  header::after { content:""; position:absolute; bottom:-1px; left:50%; transform:translateX(-50%); width:120px; height:2px;
    background:linear-gradient(90deg, transparent, var(--gold), transparent); }
  header h1 { font-size: clamp(24px,3.5vw,34px); letter-spacing:6px; background:linear-gradient(135deg, #fff 30%, #e8c56e 60%, var(--gold)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
  header .sub { color: var(--dim); font-size:12px; letter-spacing:3px; margin-top:6px; }

  /* 状态条 */
  .stat-row { display:flex; gap:12px; margin-bottom:18px; flex-wrap:wrap; }
  .stat { flex:1; min-width:140px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 18px; text-align:center; }
  .stat .n { font-size:26px; font-weight:800; }
  .stat .l { font-size:11.5px; color:var(--dim); letter-spacing:2px; margin-top:2px; }
  .stat.pending .n { color:var(--gold); }
  .stat.applied .n { color:var(--teal); }
  .stat.rejected .n { color:var(--red); }
  .stat .last { font-size:10px; color:var(--dim-2,#5c6375); margin-top:6px; font-family:var(--mono); word-break:break-all; }

  /* 操作卡 */
  .op-box { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px 18px; margin-bottom:18px; }
  .op-head { display:flex; align-items:center; gap:8px; font-size:13px; color:var(--dim); margin-bottom:12px; }
  .op-head b { color:var(--ink); }
  .op-row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .op-row input[type=number], .op-row input[type=text] { width:110px; background:#1c1f29; border:1px solid var(--line); border-radius:8px; color:var(--ink); padding:8px 10px; font-size:13px; outline:none; }
  .op-row input:focus { border-color: var(--gold); }
  .op-row label { font-size:12.5px; color:var(--dim); display:flex; align-items:center; gap:6px; cursor:pointer; }
  .op-row input[type=checkbox] { accent-color: var(--gold); width:15px; height:15px; }
  .run-btn { padding:10px 26px; background:linear-gradient(135deg, var(--gold), #c8a44a 55%, #a8822f); color:#1a1405; border:none;
    border-radius:9px; font-size:14px; font-weight:700; letter-spacing:2px; cursor:pointer; transition:all .2s; }
  .run-btn:hover { filter:brightness(1.1); transform:translateY(-1px); }
  .run-btn:disabled { opacity:.55; cursor:not-allowed; transform:none; }
  .op-box textarea { width:100%; min-height:52px; background:#1c1f29; border:1px solid var(--line); border-radius:8px; color:var(--ink);
    padding:10px 12px; font-size:13px; line-height:1.6; resize:vertical; outline:none; font-family:inherit; margin-top:10px; }
  .op-box textarea:focus { border-color: var(--gold); }
  .plan-log { margin-top:10px; font-size:11px; color:var(--teal); font-family:var(--mono); white-space:pre-wrap; max-height:120px; overflow:auto; }
  .xp-box { background:linear-gradient(145deg,rgba(62,207,142,.055),transparent 55%),var(--card); border:1px solid var(--line); border-radius:14px; padding:16px 18px; margin-bottom:18px; }
  .xp-head { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .xp-head b { font-size:14px; }
  .xp-meta { margin-left:auto; color:var(--dim); font:11px var(--mono); }
  .xp-list { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px; }
  .xp-item { padding:11px 12px; border:1px solid var(--line); border-radius:10px; background:rgba(255,255,255,.018); min-width:0; }
  .xp-title { color:var(--teal); font-size:12.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .xp-preview { color:var(--dim); font-size:11.5px; line-height:1.55; margin-top:5px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  @media(max-width:680px){ .xp-list{grid-template-columns:1fr}.wrap{padding-inline:12px}.xp-meta{display:none} }

  /* tabs */
  .tabs { display:flex; gap:8px; margin-bottom:14px; }
  .tab { padding:8px 20px; border:1px solid var(--line); border-radius:999px; font-size:13px; cursor:pointer; color:var(--dim); background:var(--card); transition:all .15s; }
  .tab.on { border-color: var(--gold); color:var(--gold); background:rgba(200,164,74,.08); font-weight:600; }
  .tab .cnt { font-family:var(--mono); font-size:11px; margin-left:4px; }

  /* 提案卡片 */
  .p-card { background:var(--card); border:1px solid var(--line); border-radius:14px; margin-bottom:14px; overflow:hidden; }
  .pc-head { padding:12px 16px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .pc-id { font-family:var(--mono); font-size:11.5px; color:var(--gold); }
  .pc-scope { font-size:10px; padding:2px 8px; border-radius:999px; border:1px solid var(--line); color:var(--dim); }
  .pc-scope.global { border-color: rgba(200,164,74,.5); color: var(--gold); }
  .pc-sum { font-size:13.5px; font-weight:600; flex:1; min-width:200px; }
  .pc-body { padding:12px 16px; }
  .pc-rat { font-size:12px; color:var(--dim); line-height:1.7; margin-bottom:10px; }
  .pc-rat b { color: var(--ink); }
  .edits { display:flex; flex-direction:column; gap:8px; }
  .edit { border:1px solid var(--line); border-radius:10px; padding:10px 12px; font-size:12.5px; line-height:1.7; }
  .edit .e-head { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:4px; }
  .edit .e-act { font-size:10px; font-weight:800; padding:2px 8px; border-radius:5px; }
  .e-act.create { background:rgba(62,207,142,.12); color:var(--teal); }
  .e-act.update { background:rgba(200,164,74,.14); color:var(--gold); }
  .e-act.delete { background:rgba(244,112,103,.14); color:var(--red); }
  .edit .e-kind { font-size:10px; color:var(--dim-2,#5c6375); }
  .edit .e-title { font-weight:700; font-size:13px; }
  .edit .e-id { font-family:var(--mono); font-size:10.5px; color:var(--dim-2,#5c6375); }
  .edit .e-content { color:var(--ink); }
  .edit .e-reason { font-size:11px; color:var(--teal); opacity:.85; }
  .edit .e-check { margin-right:6px; accent-color: var(--gold); width:14px; height:14px; vertical-align:-2px; }
  .pc-ops { padding:10px 16px; border-top:1px solid var(--line); display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .btn { padding:7px 16px; border-radius:8px; font-size:12.5px; font-weight:600; cursor:pointer; border:1px solid var(--line); background:#1c1f29; color:var(--ink); transition:all .15s; }
  .btn:hover { border-color: var(--gold); }
  .btn.ok { background:rgba(62,207,142,.1); border-color: rgba(62,207,142,.4); color:var(--teal); }
  .btn.no { background:rgba(244,112,103,.08); border-color: rgba(244,112,103,.35); color:var(--red); }
  .btn.rb { background:rgba(200,164,74,.08); border-color: rgba(200,164,74,.4); color:var(--gold); }
  .pc-note { font-size:11px; color:var(--dim-2,#5c6375); padding:8px 16px 0; }

  .empty { text-align:center; color:var(--dim-2,#5c6375); padding:50px 0; font-size:13px; }
  .loading { text-align:center; color:var(--gold); padding:40px 0; font-size:13px; animation:pulse 1s infinite; }
  @keyframes pulse { 50% { opacity:.4; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>经验沉淀台</h1>
    <div class="sub">REFINE · PRIME AGENT 提案制移植 · 无证据不沉淀</div>
  </header>

  <!-- 状态条 -->
  <div class="stat-row">
    <div class="stat pending"><div class="n" id="st-pending">–</div><div class="l">待审批</div></div>
    <div class="stat applied"><div class="n" id="st-applied">–</div><div class="l">已应用</div></div>
    <div class="stat rejected"><div class="n" id="st-rejected">–</div><div class="l">已拒绝</div></div>
    <div class="stat"><div class="l" style="color:var(--dim)">最近操作</div><div class="last" id="st-last">–</div></div>
  </div>

  <!-- 真正写入 experience.md 的最近沉淀，不再只展示提案状态 -->
  <section class="xp-box">
    <div class="xp-head"><span>🌱</span><b>最近沉淀</b><span class="xp-meta" id="xp-meta">读取中…</span></div>
    <div class="xp-list" id="xp-list"><div class="empty" style="grid-column:1/-1;padding:20px">读取经验库…</div></div>
  </section>

  <!-- 操作卡 -->
  <div class="op-box">
    <div class="op-head">⚙️ <b>生成提案</b>（扫最近记忆日志 → deepseek 按 refine 模板产出 JSON 提案 → 你审批）</div>
    <div class="op-row">
      <label>最近日志 <input type="number" id="op-log" value="15" min="1" max="60" style="width:70px"></label>
      <label><input type="checkbox" id="op-global"> global 范围</label>
      <label><input type="checkbox" id="op-dry"> dry-run 演示</label>
      <button class="run-btn" id="btn-plan">生成提案</button>
    </div>
    <textarea id="op-instr" placeholder="附加指令（可选）：例如「本轮重点是 XX 项目，看有没有值得沉淀的」"></textarea>
    <div class="plan-log" id="plan-log"></div>
  </div>

  <!-- tabs -->
  <div class="tabs">
    <div class="tab on" data-tab="pending">⏳ 待审批 <span class="cnt" id="t-pending">0</span></div>
    <div class="tab" data-tab="applied">✅ 已应用 <span class="cnt" id="t-applied">0</span></div>
    <div class="tab" data-tab="rejected">🗑 已拒绝 <span class="cnt" id="t-rejected">0</span></div>
  </div>
  <div id="list"></div>
</div>

<script>
// ══ 基础：token + API ══
let token = new URLSearchParams(location.search).get("token") || localStorage.getItem("pi_web_token") || "";
async function api(path, opts = {}) {
  opts.headers = { ...(opts.headers || {}), Authorization: "Bearer " + token, "Content-Type": "application/json" };
  if (opts.body && typeof opts.body !== "string") opts.body = JSON.stringify(opts.body);
  const r = await fetch(path, opts);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || `HTTP ${r.status}`);
  return j;
}
const $ = (s) => document.querySelector(s);

let tab = "pending";
let data = { pending: [], applied: [], rejected: [] };

async function load() {
  try {
    data = await api("/api/refine/list");
  } catch (e) {
    $("#list").innerHTML = `<div class="empty">⚠️ 加载失败：${e.message}（检查令牌 /api/refine/status）</div>`;
    return;
  }
  $("#st-pending").textContent = data.pending.length;
  $("#st-applied").textContent = data.applied.length;
  $("#st-rejected").textContent = data.rejected.length;
  $("#t-pending").textContent = data.pending.length;
  $("#t-applied").textContent = data.applied.length;
  $("#t-rejected").textContent = data.rejected.length;
  try {
    const st = await api("/api/refine/status");
    const l = st.lastLog;
    $("#st-last").textContent = l ? `${l.op} ${l.id} @ ${(l.at||"").slice(5,19).replace("T"," ")}` : "–";
    const xp = st.experience || {};
    $("#xp-meta").textContent = xp.exists ? `${xp.count || 0} 条 · 更新于 ${fmtTime(xp.updatedAt)}` : "经验库不可用";
    $("#xp-list").innerHTML = (xp.entries || []).length
      ? xp.entries.map(e => `<article class="xp-item"><div class="xp-title">${esc(e.title)}</div><div class="xp-preview">${esc(e.preview || "暂无摘要")}</div></article>`).join("")
      : `<div class="empty" style="grid-column:1/-1;padding:20px">还没有可展示的沉淀。完成任务后会自动归纳，也可在下方生成带证据提案。</div>`;
  } catch (e) {
    $("#xp-meta").textContent = "读取失败";
  }
  render();
}

function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }
function fmtTime(v) {
  if (!v) return "未知";
  const d = new Date(v);
  return Number.isNaN(d.getTime()) ? String(v).slice(0, 16) : d.toLocaleString("zh-CN", { hour12:false, month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit" });
}

function render() {
  const items = data[tab] || [];
  const box = $("#list");
  if (!items.length) { box.innerHTML = `<div class="empty">（${tab === "pending" ? "暂无待审批提案——点上方「生成提案」开始" : tab === "applied" ? "暂无已应用提案" : "暂无已拒绝提案"}）</div>`; return; }
  box.innerHTML = items.map(p => card(p)).join("");
  bindOps();
}

function card(p) {
  const edits = (p.edits || []).map((e, i) => `
    <div class="edit">
      <div class="e-head">
        <span class="e-act ${e.action || "create"}">${(e.action || "create").toUpperCase()}</span>
        <span class="e-kind">${e.kind || ""}</span>
        <span class="e-title">${esc(e.title || e.id || "")}</span>
        ${e.id ? `<span class="e-id">${esc(e.id)}</span>` : ""}
        ${tab === "pending" ? `<input class="e-check" type="checkbox" data-edit="${i + 1}" checked title="勾选才应用">` : ""}
      </div>
      ${e.content ? `<div class="e-content">${esc(e.content)}</div>` : ""}
      ${e.reason ? `<div class="e-reason">📌 证据：${esc(e.reason)}</div>` : ""}
    </div>`).join("");
  const scopeCls = p.scope === "global" ? "global" : "";
  const ops = tab === "pending"
    ? `<div class="pc-ops">
        <button class="btn ok" data-act="approve" data-id="${p.id}">✓ 通过所选</button>
        <button class="btn no" data-act="reject" data-id="${p.id}">✗ 拒绝</button>
        <span style="font-size:11px;color:var(--dim-2,#5c6375)">（取消勾选 = 跳过该条，如重复/无价值）</span>
      </div>
      <div class="pc-note">生成于 ${(p.created_at || "").slice(0, 19).replace("T", " ")} · token in=${p.usage?.prompt_tokens || "?"} out=${p.usage?.completion_tokens || "?"}</div>`
    : tab === "applied"
      ? `<div class="pc-ops">
          <button class="btn rb" data-act="rollback" data-id="${p.id}">↩ 回滚</button>
          ${p.appliedEditIds?.length ? `<span style="font-size:11px;color:var(--teal)">已应用 ${p.appliedEditIds.length}/${(p.edits||[]).length} 条${p.skippedEditIds?.length ? `，跳过 ${p.skippedEditIds.join(", ")}` : ""}</span>` : ""}
          <span style="font-size:11px;color:var(--dim-2,#5c6375)">· 应用于 ${(p.applied_at || "").slice(0, 19).replace("T", " ")}</span>
        </div>
        <div class="gene-fb" style="margin-top:8px;padding:8px 10px;border:1px dashed var(--border,#2a3145);border-radius:8px">
          <div style="font-size:11px;color:var(--dim-2,#5c6375);margin-bottom:4px">🧬 基因反馈（驱动该领域技能基因进化，0-100）</div>
          <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
            <label style="font-size:11px">效率 <input type="range" class="fb-r" data-k="efficiency" min="0" max="100" value="50" style="width:80px"></label>
            <label style="font-size:11px">可靠 <input type="range" class="fb-r" data-k="reliability" min="0" max="100" value="50" style="width:80px"></label>
            <label style="font-size:11px">适应 <input type="range" class="fb-r" data-k="adaptability" min="0" max="100" value="50" style="width:80px"></label>
            <button class="btn ok" data-act="feedback" data-id="${p.id}">✓ 提交反馈</button>
            <span class="fb-done" style="font-size:11px;color:var(--teal,#4ade80)"></span>
          </div>
        </div>`
      : `<div class="pc-ops"><span style="font-size:11px;color:var(--dim-2,#5c6375)">${p.reject_reason ? "拒绝理由：" + esc(p.reject_reason) : "已拒绝"}</span></div>`;
  return `<div class="p-card">
    <div class="pc-head">
      <span class="pc-id">#${p.id.replace("refine_", "")}</span>
      <span class="pc-scope ${scopeCls}">${p.scope || "local"}</span>
      <span class="pc-sum">${esc(p.summary || "(无摘要)")}</span>
    </div>
    <div class="pc-body">
      ${p.rationale ? `<div class="pc-rat"><b>理由：</b>${esc(p.rationale)}</div>` : ""}
      <div class="edits">${edits}</div>
    </div>
    ${ops}
  </div>`;
}

function bindOps() {
  document.querySelectorAll("[data-act]").forEach(btn => {
    btn.addEventListener("click", async () => {
      const act = btn.dataset.act, id = btn.dataset.id;
      btn.disabled = true;
      try {
        if (act === "approve") {
          const checked = [...document.querySelectorAll(`.e-check:checked`)].map(c => c.dataset.edit);
          const body = { id };
          if (checked.length) body.only = checked.join(",");
          await api("/api/refine/approve", { method: "POST", body });
        } else if (act === "reject") {
          await api("/api/refine/reject", { method: "POST", body: { id } });
        } else if (act === "rollback") {
          if (!confirm(`确认回滚提案 #${id}？将从经验库移除该提案写入的内容`)) return;
          await api("/api/refine/rollback", { method: "POST", body: { id } });
        } else if (act === "feedback") {
          const card = btn.closest(".p-card");
          const scores = {};
          card.querySelectorAll(".fb-r").forEach(r => { scores[r.dataset.k] = Number(r.value); });
          const r = await api("/api/refine/feedback", { method: "POST", body: { id, scores } });
          const done = card.querySelector(".fb-done");
          if (done) done.textContent = "✓ " + (r.msg || "已反馈");
          btn.disabled = true;
        }
      } catch (e) { alert("操作失败：" + e.message); }
      finally { btn.disabled = false; load(); }
    });
  });
}

// ══ plan ══
$("#btn-plan").addEventListener("click", async () => {
  const btn = $("#btn-plan");
  btn.disabled = true;
  $("#plan-log").textContent = "⏳ deepseek 生成提案中（约 10-40 秒）…";
  try {
    const r = await api("/api/refine/plan", { method: "POST", body: {
      log: +$("#op-log").value || 15,
      global: $("#op-global").checked,
      dryRun: $("#op-dry").checked,
      instructions: $("#op-instr").value.trim(),
    }});
    $("#plan-log").textContent = r.log || (r.latest ? `✅ 新提案 #${r.latest.id}` : "✅ 完成");
    tab = "pending";
    document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.dataset.tab === "pending"));
  } catch (e) {
    $("#plan-log").textContent = "✗ " + e.message;
  } finally { btn.disabled = false; load(); }
});

// ══ tabs ══
document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => {
  tab = t.dataset.tab;
  document.querySelectorAll(".tab").forEach(x => x.classList.toggle("on", x === t));
  render();
}));

// ══ 启动 ══
load();
</script>
</body>
</html>
