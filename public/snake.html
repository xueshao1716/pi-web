<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贪吃蛇</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            font-family: 'Segoe UI', system-ui, sans-serif; color: #eee;
        }
        .game-container { text-align: center; }
        h1 {
            margin-bottom: 20px; font-size: 2.5rem;
            background: linear-gradient(90deg, #00d4ff, #7b2cbf);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .score-board {
            display: flex; justify-content: center; gap: 40px;
            margin-bottom: 15px; font-size: 1.2rem;
        }
        .score-item {
            background: rgba(255,255,255,0.1); padding: 10px 25px;
            border-radius: 8px; backdrop-filter: blur(10px);
        }
        .score-label { font-size: 0.9rem; color: #888; margin-bottom: 5px; }
        .score-value { font-size: 1.8rem; font-weight: bold; color: #00d4ff; }
        canvas {
            border: 3px solid #00d4ff; border-radius: 10px;
            box-shadow: 0 0 30px rgba(0,212,255,0.3); background: #0a0a15;
        }
        .controls { margin-top: 20px; color: #666; font-size: 0.9rem; }
        .controls kbd {
            background: rgba(255,255,255,0.1); padding: 5px 10px;
            border-radius: 5px; margin: 0 3px; font-family: monospace;
        }
        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); display: none;
            justify-content: center; align-items: center; z-index: 100;
        }
        .overlay-content { text-align: center; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
        .game-over-title { font-size: 4rem; color: #ff6b6b; margin-bottom: 20px; text-shadow: 0 0 20px rgba(255,107,107,0.5); }
        .final-score { font-size: 1.5rem; margin-bottom: 30px; color: #ffd93d; }
        .restart-btn {
            background: linear-gradient(90deg, #00d4ff, #7b2cbf); border: none;
            padding: 15px 40px; font-size: 1.2rem; color: white;
            border-radius: 30px; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;
        }
        .restart-btn:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0,212,255,0.4); }
        .start-hint { margin-top: 15px; color: #888; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🐍 贪吃蛇</h1>
        <div class="score-board">
            <div class="score-item">
                <div class="score-label">当前得分</div>
                <div class="score-value" id="score">0</div>
            </div>
            <div class="score-item">
                <div class="score-label">最高纪录</div>
                <div class="score-value" id="highScore">0</div>
            </div>
        </div>
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <div class="controls">
            <p>使用 <kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd> 或 <kbd>W</kbd> <kbd>S</kbd> <kbd>A</kbd> <kbd>D</kbd> 控制方向</p>
            <p class="start-hint">按任意方向键开始游戏</p>
        </div>
    </div>
    <div class="overlay" id="gameOverOverlay">
        <div class="overlay-content">
            <div class="game-over-title">游戏结束</div>
            <div class="final-score">最终得分: <span id="finalScore">0</span></div>
            <button class="restart-btn" id="restartBtn">再来一局</button>
        </div>
    </div>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const highScoreEl = document.getElementById('highScore');
        const overlay = document.getElementById('gameOverOverlay');
        const finalScoreEl = document.getElementById('finalScore');
        const restartBtn = document.getElementById('restartBtn');
        
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;
        
        let snake = [];
        let food = {};
        let direction = { x: 0, y: 0 };
        let nextDirection = { x: 0, y: 0 };
        let score = 0;
        let highScore = parseInt(localStorage.getItem('snakeHighScore')) || 0;
        let gameRunning = false;
        let gameLoop = null;
        let speed = 150;
        
        highScoreEl.textContent = highScore;
        
        function initGame() {
            snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
            direction = { x: 1, y: 0 };
            nextDirection = { x: 1, y: 0 };
            score = 0;
            scoreEl.textContent = score;
            spawnFood();
            gameRunning = true;
            if (gameLoop) clearInterval(gameLoop);
            gameLoop = setInterval(gameStep, speed);
        }
        
        function spawnFood() {
            let newFood;
            do {
                newFood = {
                    x: Math.floor(Math.random() * tileCount),
                    y: Math.floor(Math.random() * tileCount)
                };
            } while (isSnakeAt(newFood.x, newFood.y));
            food = newFood;
        }
        
        function isSnakeAt(x, y) {
            return snake.some(s => s.x === x && s.y === y);
        }
        
        function gameStep() {
            if (!gameRunning) return;
            direction = { ...nextDirection };
            const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };
            
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount || isSnakeAt(head.x, head.y)) {
                gameOver();
                return;
            }
            
            snake.unshift(head);
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreEl.textContent = score;
                spawnFood();
                if (score % 50 === 0 && speed > 50) {
                    speed -= 10;
                    clearInterval(gameLoop);
                    gameLoop = setInterval(gameStep, speed);
                }
            } else {
                snake.pop();
            }
            draw();
        }
        
        function draw() {
            ctx.fillStyle = '#0a0a15';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.strokeStyle = 'rgba(255,255,255,0.03)';
            ctx.lineWidth = 1;
            for (let i = 0; i <= tileCount; i++) {
                ctx.beginPath(); ctx.moveTo(i * gridSize, 0); ctx.lineTo(i * gridSize, canvas.height); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, i * gridSize); ctx.lineTo(canvas.width, i * gridSize); ctx.stroke();
            }
            
            const fx = food.x * gridSize + gridSize / 2;
            const fy = food.y * gridSize + gridSize / 2;
            const grad = ctx.createRadialGradient(fx, fy, 0, fx, fy, gridSize);
            grad.addColorStop(0, '#ff6b6b');
            grad.addColorStop(1, 'rgba(255,107,107,0)');
            ctx.fillStyle = grad;
            ctx.fillRect(food.x * gridSize - gridSize / 2, food.y * gridSize - gridSize / 2, gridSize * 2, gridSize * 2);
            ctx.fillStyle = '#ff6b6b';
            ctx.beginPath();
            ctx.arc(fx, fy, gridSize / 2 - 2, 0, Math.PI * 2);
            ctx.fill();
            
            snake.forEach((seg, i) => {
                const alpha = 1 - (i / snake.length) * 0.5;
                const green = Math.floor(212 - (i / snake.length) * 100);
                ctx.fillStyle = `rgba(0, ${green}, 255, ${alpha})`;
                const x = seg.x * gridSize + 1;
                const y = seg.y * gridSize + 1;
                const size = gridSize - 2;
                const r = 5;
                ctx.beginPath();
                ctx.moveTo(x + r, y);
                ctx.lineTo(x + size - r, y);
                ctx.quadraticCurveTo(x + size, y, x + size, y + r);
                ctx.lineTo(x + size, y + size - r);
                ctx.quadraticCurveTo(x + size, y + size, x + size - r, y + size);
                ctx.lineTo(x + r, y + size);
                ctx.quadraticCurveTo(x, y + size, x, y + size - r);
                ctx.lineTo(x, y + r);
                ctx.quadraticCurveTo(x, y, x + r, y);
                ctx.closePath();
                ctx.fill();
                
                if (i === 0) {
                    ctx.fillStyle = '#fff';
                    const es = 3, eo = 5;
                    let lx, ly, rx, ry;
                    if (direction.x === 1) { lx = x + size - eo; ly = y + eo; rx = x + size - eo; ry = y + size - eo; }
                    else if (direction.x === -1) { lx = x + eo; ly = y + eo; rx = x + eo; ry = y + size - eo; }
                    else if (direction.y === -1) { lx = x + eo; ly = y + eo; rx = x + size - eo; ry = y + eo; }
                    else { lx = x + eo; ly = y + size - eo; rx = x + size - eo; ry = y + size - eo; }
                    ctx.beginPath(); ctx.arc(lx, ly, es, 0, Math.PI * 2); ctx.fill();
                    ctx.beginPath(); ctx.arc(rx, ry, es, 0, Math.PI * 2); ctx.fill();
                }
            });
        }
        
        function gameOver() {
            gameRunning = false;
            clearInterval(gameLoop);
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('snakeHighScore', highScore);
                highScoreEl.textContent = highScore;
            }
            finalScoreEl.textContent = score;
            overlay.style.display = 'flex';
        }
        
        document.addEventListener('keydown', e => {
            if (!gameRunning && overlay.style.display !== 'flex') {
                if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','a','s','d','W','A','S','D'].includes(e.key)) initGame();
            }
            switch (e.key) {
                case 'ArrowUp': case 'w': case 'W': if (direction.y !== 1) nextDirection = { x: 0, y: -1 }; break;
                case 'ArrowDown': case 's': case 'S': if (direction.y !== -1) nextDirection = { x: 0, y: 1 }; break;
                case 'ArrowLeft': case 'a': case 'A': if (direction.x !== 1) nextDirection = { x: -1, y: 0 }; break;
                case 'ArrowRight': case 'd': case 'D': if (direction.x !== -1) nextDirection = { x: 1, y: 0 }; break;
            }
        });
        
        restartBtn.addEventListener('click', () => {
            overlay.style.display = 'none';
            speed = 150;
            initGame();
        });
        
        draw();
    </script>
</body>
</html>
