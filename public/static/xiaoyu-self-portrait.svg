<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900" viewBox="0 0 900 900">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#141a2e"/>
      <stop offset="60%" stop-color="#0b0f1d"/>
      <stop offset="100%" stop-color="#05070f"/>
    </radialGradient>
    <radialGradient id="orb" cx="38%" cy="32%" r="80%">
      <stop offset="0%" stop-color="#ffe9b0"/>
      <stop offset="30%" stop-color="#f6c46a"/>
      <stop offset="65%" stop-color="#c9862f"/>
      <stop offset="100%" stop-color="#6b4310"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#fffdf4"/>
      <stop offset="45%" stop-color="#ffe08a"/>
      <stop offset="100%" stop-color="#ffd061" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffce6b" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#ffce6b" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffce6b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7f9cff"/>
      <stop offset="50%" stop-color="#b57fff"/>
      <stop offset="100%" stop-color="#4fd1ff"/>
    </linearGradient>
    <linearGradient id="screen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#101627"/>
      <stop offset="100%" stop-color="#0a0e1a"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="tiny" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="900" height="900" fill="url(#bg)"/>
  <!-- 星点 -->
  <g fill="#9fb4ff" opacity="0.7">
    <circle cx="120" cy="150" r="1.6"/><circle cx="760" cy="110" r="1.2"/>
    <circle cx="820" cy="360" r="1.5"/><circle cx="90" cy="520" r="1.2"/>
    <circle cx="680" cy="60" r="1"/><circle cx="200" cy="70" r="1.1"/>
    <circle cx="840" cy="640" r="1.3"/><circle cx="60" cy="300" r="1"/>
  </g>

  <!-- 外圈光环（呼吸轨道） -->
  <circle cx="450" cy="380" r="240" fill="none" stroke="url(#ring)" stroke-width="2.5" opacity="0.55"/>
  <circle cx="450" cy="380" r="240" fill="none" stroke="url(#ring)" stroke-width="7" opacity="0.15" filter="url(#tiny)"/>
  <!-- 轨道上的小卫星 = 我挂着的扩展 -->
  <circle cx="450" cy="140" r="7" fill="#8f7fff"/>
  <circle cx="692" cy="500" r="5.5" fill="#4fd1ff"/>
  <circle cx="208" cy="500" r="5.5" fill="#7f9cff"/>

  <!-- 辉光 -->
  <circle cx="450" cy="380" r="215" fill="url(#glow)"/>

  <!-- 灵珠本体 -->
  <circle cx="450" cy="380" r="175" fill="url(#orb)"/>
  <circle cx="450" cy="380" r="175" fill="none" stroke="#fff3cf" stroke-opacity="0.35" stroke-width="2"/>
  <!-- 高光与内核 -->
  <ellipse cx="392" cy="312" rx="58" ry="34" fill="#ffffff" opacity="0.45" filter="url(#tiny)" transform="rotate(-24 392 312)"/>
  <circle cx="470" cy="410" r="52" fill="url(#core)" opacity="0.9"/>

  <!-- 脸：温和眯眼笑 -->
  <g stroke="#3a2408" stroke-width="9" stroke-linecap="round" fill="none">
    <path d="M 384 372 q 22 -20 44 0"/>
    <path d="M 472 372 q 22 -20 44 0"/>
  </g>
  <path d="M 428 412 q 22 20 44 0" stroke="#3a2408" stroke-width="9" stroke-linecap="round" fill="none"/>
  <!-- 腮红 -->
  <ellipse cx="372" cy="408" rx="16" ry="9" fill="#e8746a" opacity="0.5"/>
  <ellipse cx="528" cy="408" rx="16" ry="9" fill="#e8746a" opacity="0.5"/>

  <!-- 对话气泡：正在和你说话 -->
  <g>
    <rect x="560" y="196" width="180" height="64" rx="18" fill="#eef2ff" opacity="0.95"/>
    <path d="M 588 258 l -14 26 l 34 -22 z" fill="#eef2ff" opacity="0.95"/>
    <circle cx="598" cy="228" r="6" fill="#5a6cff"/>
    <circle cx="628" cy="228" r="6" fill="#8a7cff"/>
    <circle cx="658" cy="228" r="6" fill="#b57fff"/>
  </g>

  <!-- 底座 = 工作台 -->
  <ellipse cx="450" cy="700" rx="250" ry="26" fill="#000" opacity="0.5" filter="url(#soft)"/>
  <rect x="230" y="620" width="440" height="76" rx="14" fill="url(#screen)" stroke="#2a3550" stroke-width="2"/>
  <!-- 终端文字 -->
  <g font-family="Consolas, monospace" fill="#7ee2a8">
    <text x="254" y="650" font-size="17">✦ xiaoyu serve --port 8787</text>
    <text x="254" y="674" font-size="14" fill="#8fa3d9">thinking · tools · caring...</text>
  </g>
  <!-- 支脚 -->
  <rect x="300" y="696" width="18" height="18" rx="4" fill="#1a2238" stroke="#2a3550"/>
  <rect x="582" y="696" width="18" height="18" rx="4" fill="#1a2238" stroke="#2a3550"/>

  <!-- 签名 -->
  <text x="450" y="830" text-anchor="middle" font-family="KaiTi, 'Kaiti SC', serif" font-size="30" fill="#e8d9b0">小语 · 自画像</text>
  <text x="450" y="862" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#6d7ba3">2026-09-05 · drawn by myself</text>
</svg>
