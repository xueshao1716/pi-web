<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚖️ 模型评测台 · 小语</title>
<link rel="icon" href="/static/icon-192.png">
<link rel="stylesheet" href="/static/app.css">
<style>
  :root {
    --ink: #e6e8ee; --paper: #0b0c0f; --card: #14161d; --gold: #b08d4a;
    --line: #262b38; --dim: #8a91a5; --teal: #3ecf8e;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background: var(--paper); color: var(--ink); font-family:'Noto Sans SC',sans-serif; min-height:100vh; }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 24px 20px 60px; }

  header { text-align:center; padding: 14px 0 20px; border-bottom:1px solid var(--line); margin-bottom: 20px; position:relative; }
  header::after { content:""; position:absolute; bottom:-1px; left:50%; transform:translateX(-50%); width:120px; height:2px;
    background:linear-gradient(90deg, transparent, var(--gold), transparent); }
  header h1 { font-size: clamp(24px,3.5vw,34px); letter-spacing:6px; background:linear-gradient(135deg, #fff 30%, #e8c56e 60%, var(--gold)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
  header .sub { color: var(--dim); font-size:12px; letter-spacing:4px; margin-top:6px; }

  /* 输入区 */
  .q-box { background: var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; margin-bottom:16px; }
  .q-box textarea { width:100%; min-height:70px; background:var(--panel-2, #171a22); border:1px solid var(--line); border-radius:8px;
    color:var(--ink); padding:12px; font-size:14px; line-height:1.7; resize:vertical; outline:none; font-family:inherit; }
  .q-box textarea:focus { border-color: var(--gold); }
  .q-row { display:flex; gap:10px; align-items:center; margin-top:12px; flex-wrap:wrap; }
  .run-btn { padding:11px 28px; background:linear-gradient(135deg, var(--gold), #c8a44a 55%, #a8822f); color:#1a1405; border:none;
    border-radius:9px; font-size:14px; font-weight:700; letter-spacing:2px; cursor:pointer; transition:all .2s; }
  .run-btn:hover { filter:brightness(1.1); transform:translateY(-1px); }
  .run-btn:disabled { opacity:.6; cursor:not-allowed; transform:none; }
  .run-btn.stop { background:linear-gradient(135deg, var(--red,#f47067), #c0392b); }
  .sel-all { font-size:12.5px; color:var(--dim); cursor:pointer; user-select:none; }
  .sel-all:hover { color:var(--gold); }

  /* 模型选择 */
  .m-box { background: var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:16px; }
  .m-box .mb-head { display:flex; align-items:center; gap:8px; font-size:13px; color:var(--dim); margin-bottom:12px; }
  .m-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(170px, 1fr)); gap:8px; }
  .m-chip { display:flex; align-items:center; gap:7px; padding:8px 12px; border:1px solid var(--line); border-radius:9px;
    font-size:12.5px; cursor:pointer; transition:all .15s; background:#1c1f29; color:var(--dim); }
  .m-chip:hover { border-color: rgba(200,164,74,.5); }
  .m-chip.on { border-color: var(--gold); color:var(--ink); background: rgba(200,164,74,.08); }
  .m-chip .ck { width:16px; height:16px; border-radius:4px; border:1.5px solid var(--line); flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:10px; }
  .m-chip.on .ck { background:var(--gold); border-color:var(--gold); color:#1a1405; }
  .m-chip .mi { font-weight:600; color:var(--text); }
  .m-chip .ms { font-size:10.5px; color:var(--dim-2,#5c6375); margin-left:auto; }

  /* 结果 */
  .res-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(360px, 1fr)); gap:14px; }
  .res-card { background: var(--card); border:1px solid var(--line); border-radius:14px; overflow:hidden; display:flex; flex-direction:column; }
  .res-card.best { border-color: var(--gold); box-shadow: 0 0 0 2px rgba(200,164,74,.25); }
  .rc-head { padding:10px 14px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .rc-name { font-weight:700; font-size:13.5px; color:var(--accent); }
  .rc-status { margin-left:auto; font-size:11px; color:var(--dim); font-family:var(--mono); }
  .rc-status.run { color: var(--teal); animation: pulse 1s infinite; }
  .rc-status.err { color: var(--red,#f47067); }
  .rc-meta { font-size:10.5px; color:var(--dim-2,#5c6375); font-family:var(--mono); padding:4px 14px; border-bottom:1px solid var(--line); }
  .rc-body { flex:1; padding:12px 14px; font-size:13px; line-height:1.75; white-space:pre-wrap; word-break:break-word; max-height:420px; overflow-y:auto; }
  .rc-body.empty { color:var(--dim); display:flex; align-items:center; justify-content:center; }
  .rc-foot { padding:8px 14px; border-top:1px solid var(--line); display:flex; gap:6px; align-items:center; }
  .score-btn { padding:4px 12px; border-radius:6px; font-size:11.5px; cursor:pointer; border:1px solid var(--line); background:none; color:var(--dim); transition:all .15s; }
  .score-btn:hover { border-color: var(--gold); }
  .score-btn.on { background:var(--gold); color:#1a1405; border-color:var(--gold); font-weight:700; }
  .rc-foot .spacer { flex:1; }
  .copy-one { font-size:11px; color:var(--dim); cursor:pointer; background:none; border:none; }
  .copy-one:hover { color:var(--gold); }

  /* 汇总 */
  .summary { margin-top:16px; background: var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; }
  .summary h3 { font-size:14px; color:var(--gold); margin-bottom:10px; }
  .sum-row { display:flex; flex-wrap:wrap; gap:10px; }
  .sum-chip { padding:6px 14px; border-radius:8px; border:1px solid var(--line); font-size:12.5px; display:flex; gap:6px; align-items:center; }
  .sum-chip .rank { color:var(--gold); font-weight:700; }
  .sum-chip .st { color:var(--dim-2,#5c6375); font-size:10.5px; }

  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
  .w-login { position:fixed; inset:0; z-index:100; display:none; align-items:center; justify-content:center; background:var(--paper); flex-direction:column; gap:14px; }
  .w-login .card { width:380px; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:36px 30px; }
  .w-login h2 { font-size:16px; margin-bottom:8px; }
  .w-login p { font-size:12.5px; color:var(--dim-2); margin-bottom:16px; }
  .w-login input { width:100%; box-sizing:border-box; background:var(--panel-2,#171a22); border:1px solid var(--line); color:var(--ink); border-radius:8px; padding:10px 12px; font-size:13px; outline:none; margin-bottom:10px; }
  .w-login button { width:100%; padding:10px 0; border:none; border-radius:8px; background:var(--gold); color:#1a1405; font-weight:700; cursor:pointer; font-size:13px; }
  .w-login .err { color:var(--red,#f47067); font-size:12px; margin-top:10px; min-height:16px; }
</style>
</head>
<body>

<!-- 登录层 -->
<div class="w-login" id="w-login">
  <div class="card">
    <h2>需要访问令牌</h2>
    <p>输入工作台访问令牌（见服务端 .token 文件）</p>
    <input id="w-token-input" type="password" placeholder="访问令牌" autocomplete="off">
    <button id="w-token-go">连接</button>
    <div class="err" id="w-token-err"></div>
  </div>
</div>

<div class="wrap" id="app">
  <header>
    <h1>⚖️ 模型评测台</h1>
    <div class="sub">同一问题 · 多模型并行 · 看谁做的最好</div>
  </header>

  <div class="q-box">
    <textarea id="prompt" placeholder="输入要评测的问题/任务，例如：写一个 Python 快速排序，并解释时间复杂度"></textarea>
    <div class="q-row">
      <button class="run-btn" id="runBtn">🚀 开始评测</button>
      <button class="run-btn stop" id="stopBtn" hidden>⏹ 停止</button>
      <span class="sel-all" id="selAll">☑ 全选 / ☐ 全不选</span>
      <span style="margin-left:auto;font-size:11.5px;color:var(--dim-2)" id="selCount">已选 0 个</span>
    </div>
  </div>

  <div class="m-box">
    <div class="mb-head">📦 选择要对比的模型（OpenCode Go 套餐优先）</div>
    <div class="m-grid" id="modelGrid"></div>
  </div>

  <div class="res-grid" id="resGrid"></div>

  <div class="summary" id="summary" hidden>
    <h2 style="font-size:15px;margin:14px 0 8px">🏆 评测结果汇总</h2>
    <div class="sum-row" id="sumRow"></div>
  </div>
</div>

<script>
// ══ 独立页基础：token + API ══
let token = new URLSearchParams(location.search).get("token") || localStorage.getItem("pi_web_token") || "";
async function api(path, opts = {}) {
  opts.headers = { ...(opts.headers || {}), Authorization: "Bearer " + token };
  if (opts.body && typeof opts.body === "object") { opts.headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(opts.body); }
  const r = await fetch(path, opts);
  const ct = r.headers.get("content-type") || "";
  const data = ct.includes("json") ? await r.json() : null;
  if (!r.ok) { const e = new Error((data && data.error) || "HTTP " + r.status); e.status = r.status; throw e; }
  return data;
}
function esc(s) { return String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
const $ = id => document.getElementById(id);

// 登录
$("w-token-go").addEventListener("click", async () => {
  const tk = $("w-token-input").value.trim();
  if (!tk) return;
  token = tk; localStorage.setItem("pi_web_token", tk);
  try { await api("/api/models"); enter(); } catch { $("w-token-err").textContent = "令牌无效"; }
});
async function enter() {
  $("w-login").style.display = "none";
  $("app").style.display = "block";
  await loadModels();
}
(async () => { try { await api("/api/models"); enter(); } catch { $("w-login").style.display = "flex"; } })();

// ══ 模型加载（OpenCode Go 优先）══
let allModels = [];
const selected = new Set();
// 评测预置：OpenCode Go 核心模型（默认选 6 个主力，可自行增删）
const GO_PRESET = ["kimi-k3", "glm-5.2", "qwen3.8-max", "deepseek-v4-pro", "gpt-5.6-luna", "grok-4.5"];

async function loadModels() {
  const d = await api("/api/models");
  allModels = (d.models || []).filter(m => m.capabilities?.chat);
  const grid = $("modelGrid");
  grid.innerHTML = "";
  // 分组：opencode-go 在最前
  const sorted = [...allModels].sort((a, b) => {
    const pa = a.provider === "opencode-go" ? 0 : 1;
    const pb = b.provider === "opencode-go" ? 0 : 1;
    if (pa !== pb) return pa - pb;
    return (a.id || "").localeCompare(b.id || "");
  });
  for (const m of sorted) {
    const chip = document.createElement("div");
    chip.className = "m-chip";
    const key = `${m.provider}/${m.id}`;
    chip.dataset.key = key;
    const isGo = m.provider === "opencode-go";
    const pre = isGo && GO_PRESET.includes(m.id);
    chip.innerHTML = `<span class="ck"></span><span class="mi">${esc(m.id)}</span>${isGo ? '<span class="ms">Go</span>' : ""}`;
    chip.title = `${m.provider} / ${m.name || m.id}`;
    chip.addEventListener("click", () => {
      if (selected.has(key)) { selected.delete(key); chip.classList.remove("on"); }
      else { selected.add(key); chip.classList.add("on"); }
      $("selCount").textContent = `已选 ${selected.size} 个`;
    });
    grid.appendChild(chip);
    if (pre) { selected.add(key); chip.classList.add("on"); }
  }
  $("selCount").textContent = `已选 ${selected.size} 个`;
}
$("selAll").addEventListener("click", () => {
  const chips = document.querySelectorAll(".m-chip");
  const allOn = selected.size === chips.length;
  if (allOn) { selected.clear(); chips.forEach(c => c.classList.remove("on")); }
  else { chips.forEach(c => { selected.add(c.dataset.key); c.classList.add("on"); }); }
  $("selCount").textContent = `已选 ${selected.size} 个`;
});

// ══ 评测执行 ══
let running = false;
let abortCtrl = null;

function mdRender(text) {
  // 简单 markdown：代码块/加粗/标题
  const t = esc(String(text || ""));
  let html = t;
  // 代码块
  html = html.replace(/```(\w*)\n?([\s\S]*?)```/g, (m, lang, code) => `<pre style="background:#0d1117;border:1px solid var(--line);border-radius:8px;padding:10px;overflow-x:auto;font-family:var(--mono);font-size:12px"><code>${code}</code></pre>`);
  // 行内代码
  html = html.replace(/`([^`]+)`/g, '<code style="background:#1c1f29;padding:1px 5px;border-radius:4px;font-family:var(--mono);font-size:12px">$1</code>');
  // 标题
  html = html.replace(/^### (.*)$/gm, '<h3 style="margin:8px 0 4px;color:var(--text)">$1</h3>');
  html = html.replace(/^## (.*)$/gm, '<h2 style="margin:10px 0 4px;color:var(--gold)">$1</h2>');
  // 加粗
  html = html.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  // 列表
  html = html.replace(/^- (.*)$/gm, '• $1');
  return html;
}

$("runBtn").addEventListener("click", runBench);
$("stopBtn").addEventListener("click", () => { if (abortCtrl) abortCtrl.abort(); });

async function runBench() {
  const prompt = $("prompt").value.trim();
  if (!prompt) { toast("先输入要评测的问题"); return; }
  if (selected.size < 1) { toast("至少选 1 个模型"); return; }
  const models = [...selected].map(k => { const [provider, id] = k.split("/"); return { provider, id }; });
  running = true;
  $("runBtn").disabled = true; $("runBtn").textContent = "评测中…";
  $("stopBtn").hidden = false;
  $("summary").hidden = true;
  $("resGrid").innerHTML = "";
  // 渲染卡片
  const cards = {};
  for (const m of models) {
    const card = document.createElement("div");
    card.className = "res-card";
    card.id = "card-" + m.provider.replace(/\W/g, "") + "-" + m.id.replace(/\W/g, "");
    card.innerHTML = `<div class="rc-head"><span class="rc-name">${esc(m.provider)}/${esc(m.id)}</span><span class="rc-status run" id="st-${m.id}">⏳ 运行中</span></div>
      <div class="rc-meta" id="mt-${m.id}">…</div>
      <div class="rc-body empty" id="bd-${m.id}">思考中…</div>
      <div class="rc-foot">
        <button class="score-btn" data-score="good" data-id="${m.id}">👍 好</button>
        <button class="score-btn" data-score="mid" data-id="${m.id}">👌 一般</button>
        <button class="score-btn" data-score="bad" data-id="${m.id}">👎 差</button>
        <div class="spacer"></div>
        <button class="copy-one" data-id="${m.id}">📋 复制</button>
      </div>`;
    $("resGrid").appendChild(card);
    cards[m.id] = card;
  }
  // 评分按钮
  $("resGrid").addEventListener("click", (e) => {
    const b = e.target.closest(".score-btn");
    if (b) {
      const id = b.dataset.id;
      document.querySelectorAll(`.score-btn[data-id="${id}"]`).forEach(x => x.classList.remove("on"));
      b.classList.add("on");
      updateSummary();
    }
    const cp = e.target.closest(".copy-one");
    if (cp) {
      const id = cp.dataset.id;
      const body = $(`bd-${id}`);
      if (body && !body.classList.contains("empty")) {
        navigator.clipboard.writeText(body.innerText).then(() => toast("已复制")).catch(() => {});
      }
    }
  });
  try {
    const data = await api("/api/compare", { method: "POST", body: { message: prompt, models }, timeoutMs: 600000 });
    data.results.forEach((r, i) => {
      const m = models[i];
      const st = $(`st-${m.id}`), mt = $(`mt-${m.id}`), bd = $(`bd-${m.id}`);
      if (!st) return;
      if (r.error) {
        st.textContent = "❌"; st.className = "rc-status err";
        mt.textContent = "错误";
        bd.innerHTML = `<span style="color:var(--red)">错误: ${esc(r.error)}</span>`;
        bd.classList.remove("empty");
      } else {
        const sec = ((r.ms || 0) / 1000).toFixed(1);
        const chars = (r.text || "").length;
        st.textContent = `⏱ ${sec}s`; st.className = "rc-status";
        mt.textContent = `${sec}s · ${chars} 字 · ${(r.tokens?.input || 0)}/$(r.tokens?.output || 0) tok`;
        bd.innerHTML = mdRender(r.text || "（无回复）");
        bd.classList.remove("empty");
      }
    });
    updateSummary();
    toast("评测完成");
  } catch (e) {
    toast("评测中断: " + e.message);
  } finally {
    running = false;
    $("runBtn").disabled = false; $("runBtn").textContent = "🚀 开始评测";
    $("stopBtn").hidden = true;
  }
}

function updateSummary() {
  // 统计每个模型的评分
  const scores = {};
  document.querySelectorAll(".score-btn.on").forEach(b => {
    const id = b.dataset.id;
    scores[id] = b.dataset.score;
  });
  const scored = Object.keys(scores);
  if (!scored.length) return;
  $("summary").hidden = false;
  const order = { good: 0, mid: 1, bad: 2 };
  scored.sort((a, b) => order[scores[a]] - order[scores[b]]);
  const row = $("sumRow");
  row.innerHTML = "";
  scored.forEach((id, idx) => {
    const m = allModels.find(x => x.id === id);
    const label = m ? `${m.provider}/${m.id}` : id;
    const icon = scores[id] === "good" ? "👍" : scores[id] === "mid" ? "👌" : "👎";
    row.innerHTML += `<div class="sum-chip"><span class="rank">#${idx + 1}</span><span>${icon} ${esc(label)}</span></div>`;
  });
}
function toast(msg) {
  let t = document.getElementById("bench-toast");
  if (!t) {
    t = document.createElement("div");
    t.id = "bench-toast";
    t.style.cssText = "position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--panel-2);border:1px solid var(--border);border-radius:10px;padding:10px 18px;font-size:13px;color:var(--text);z-index:400;box-shadow:0 10px 30px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .25s";
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity = "1";
  setTimeout(() => t.style.opacity = "0", 2200);
}
</script>
</body>
</html>
