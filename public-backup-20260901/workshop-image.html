<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>绘界 · AI 绘画工作室</title>
  <link rel="icon" href="/static/icon-192.png">
  <link rel="stylesheet" href="/static/app.css">
  <link rel="stylesheet" href="/static/css/workshop-image.css?v=1">
</head>
<body>
  <header class="studio-top">
    <a class="back" href="/workshop">← 专项工作台</a>
    <div class="brand"><span class="brand-mark">◇</span><div><b>绘界</b><small>AI IMAGE STUDIO</small></div></div>
    <div class="top-spacer"></div>
    <span class="connection" id="connection">连接中…</span>
    <button class="ghost-btn" id="clear-board" type="button">清空画布</button>
  </header>

  <main class="studio-shell">
    <aside class="control-panel">
      <section class="panel-block project-block">
        <div class="section-label"><span>01</span> 项目</div>
        <input id="project-name" class="field" maxlength="60" value="未命名创作" aria-label="项目名称">
        <div class="preset-row" id="preset-row">
          <button data-preset="poster">海报</button><button data-preset="product">产品</button>
          <button data-preset="illustration">插画</button><button data-preset="portrait">人物</button>
          <button data-preset="logo">标志</button>
        </div>
      </section>

      <section class="panel-block">
        <div class="section-label"><span>02</span> 创作描述</div>
        <textarea id="prompt" rows="7" placeholder="描述你想要的画面：主体、场景、构图、光线、色彩、材质……"></textarea>
        <div class="prompt-tools"><span id="prompt-count">0 / 1600</span><button id="polish" type="button">✨ 智能补全</button></div>
        <details>
          <summary>负面描述（可选）</summary>
          <textarea id="negative" rows="3" placeholder="不希望出现的元素，如：模糊、水印、畸形手指"></textarea>
        </details>
      </section>

      <section class="panel-block">
        <div class="section-label"><span>03</span> 视觉语言</div>
        <div class="style-grid" id="style-grid">
          <button data-style="电影感，戏剧光影，高对比，精细调色">电影感</button>
          <button data-style="极简设计，大面积留白，克制配色，清晰视觉层级">极简</button>
          <button data-style="东方美学，诗意留白，传统色彩，细腻纹理">东方</button>
          <button data-style="未来科技，霓虹光，金属材质，深色空间">科技</button>
          <button data-style="编辑级商业摄影，真实材质，棚拍布光">商业</button>
          <button data-style="手绘插画，丰富笔触，叙事构图，柔和色彩">手绘</button>
        </div>
      </section>

      <section class="panel-block">
        <div class="section-label"><span>04</span> 参考图</div>
        <input id="reference-file" type="file" accept="image/*" hidden>
        <button class="reference-drop" id="reference-drop" type="button">
          <span id="reference-empty"><b>＋ 添加参考图</b><small>点击或拖拽 · JPG / PNG / WEBP</small></span>
          <img id="reference-preview" alt="参考图" hidden>
        </button>
        <div class="reference-actions" id="reference-actions" hidden><span id="reference-name"></span><button id="remove-reference" type="button">移除</button></div>
      </section>

      <section class="panel-block generate-block">
        <div class="section-label"><span>05</span> 生成设置</div>
        <label>模型<select id="model"><option value="">加载可用模型…</option></select></label>
        <div class="setting-row">
          <label>画幅<select id="size"><option value="1024x1024">1:1 方形</option><option value="832x1472">9:16 竖版</option><option value="1472x832">16:9 横版</option></select></label>
          <label>数量<select id="count"><option value="1">1 张</option><option value="2" selected>2 张</option><option value="4">4 张</option></select></label>
        </div>
        <button class="generate-btn" id="generate" type="button"><span>生成到画布</span><small>GENERATE</small></button>
        <div class="generate-status" id="generate-status"></div>
      </section>
    </aside>

    <section class="canvas-panel">
      <div class="canvas-head">
        <div><span class="eyebrow">CREATIVE CANVAS</span><h1 id="canvas-title">未命名创作</h1></div>
        <div class="canvas-meta"><span id="work-count">0 个作品</span><span>生成后自动保存到资产库</span></div>
      </div>
      <div class="canvas" id="canvas">
        <div class="empty-canvas" id="empty-canvas">
          <div class="empty-orbit"><span>◇</span></div>
          <h2>从一个视觉想法开始</h2>
          <p>选择创作类型，写下画面描述。生成结果会留在画布，并自动保存到工作空间。</p>
          <div class="quick-start" id="quick-start">
            <button data-quick="一张深色科技风产品发布海报，中央悬浮的透明智能设备，青蓝霓虹轮廓光，电影级构图，大面积留白">科技海报</button>
            <button data-quick="东方山水意境插画，远山薄雾，朱红色点景人物，宣纸纹理，克制留白">东方插画</button>
            <button data-quick="高端香水产品摄影，黑色镜面台座，金色边缘光，水雾与微粒，奢华商业广告">产品摄影</button>
          </div>
        </div>
        <div class="art-grid" id="art-grid"></div>
      </div>
    </section>
  </main>

  <div class="lightbox" id="lightbox" hidden><button id="lightbox-close">×</button><img id="lightbox-image" alt="作品预览"><div id="lightbox-caption"></div></div>
  <script type="module" src="/static/js/workshop-image.js?v=1"></script>
</body>
</html>
