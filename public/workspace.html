<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📦 工作空间 · 小语</title>
<link rel="icon" href="/static/icon-192.png">
<link rel="stylesheet" href="/static/app.css">
<style>
  body { display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
  .w-top { display: flex; align-items: center; gap: 10px; padding: 10px 18px; border-bottom: 1px solid var(--border); background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: blur(12px); flex-shrink: 0; }
  .w-top .back { background: var(--panel-2); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 6px 12px; font-size: 12.5px; cursor: pointer; text-decoration: none; }
  .w-top .back:hover { border-color: var(--accent); color: var(--accent); }
  .w-top .title { font-size: 15px; font-weight: 700; color: var(--text); }
  .w-top .spacer { flex: 1; }
  .w-top .status { font-size: 11.5px; color: var(--dim-2); font-family: var(--mono); }
  .ws-btn { background: var(--panel-2); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 6px 12px; font-size: 12px; cursor: pointer; transition: border-color .12s, color .12s; }
  .ws-btn:hover { border-color: var(--accent); color: var(--accent); }
  .ws-body { flex: 1; display: flex; min-height: 0; }
  .ws-side { width: 300px; min-width: 200px; max-width: 520px; flex-shrink: 0; border-right: 1px solid var(--border); display: flex; flex-direction: column; background: color-mix(in srgb, var(--bg) 55%, transparent); }
  .ws-resizer { width: 5px; flex-shrink: 0; cursor: col-resize; background: transparent; }
  .ws-resizer:hover, .ws-resizer.dragging { background: color-mix(in srgb, var(--accent) 35%, transparent); }
  .ws-search-wrap { padding: 10px 12px 6px; flex-shrink: 0; }
  .ws-search-wrap input { width: 100%; box-sizing: border-box; background: var(--panel-2); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 8px 12px; font-size: 12.5px; outline: none; }
  .ws-search-wrap input:focus { border-color: var(--accent); }
  #ws-search-results { max-height: 28%; overflow-y: auto; flex-shrink: 0; padding: 0 6px; }
  #ws-tree { flex: 1; overflow-y: auto; min-height: 0; padding: 2px 6px 10px; }
  .ws-preview { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .pv-head { display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--border); flex-shrink: 0; flex-wrap: wrap; }
  .pv-title { font-size: 13px; font-weight: 600; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 45%; }
  .pv-meta { font-size: 11px; color: var(--dim-2); font-family: var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pv-actions { display: flex; gap: 6px; margin-left: auto; }
  .pv-actions .ws-btn { padding: 5px 10px; font-size: 11.5px; }
  .pv-body { flex: 1; overflow: auto; padding: 18px 22px; min-height: 0; }
  .pv-body .markdown { line-height: 1.75; }
  .pv-body .markdown h1, .pv-body .markdown h2, .pv-body .markdown h3 { margin: .6em 0 .3em; color: var(--text); }
  .pv-body .markdown p { margin: .4em 0; color: var(--dim); }
  .pv-body .markdown code { background: var(--panel-2); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; font-size: 12px; font-family: var(--mono); }
  .pv-body .markdown pre { background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; padding: 12px; overflow: auto; }
  .pv-body pre { white-space: pre-wrap; word-break: break-all; font-family: var(--mono); font-size: 12.5px; color: var(--dim); line-height: 1.7; }
  .pv-empty { display: flex; align-items: center; justify-content: center; height: 100%; color: var(--dim-2); font-size: 13px; text-align: center; padding: 40px; line-height: 2; }
  .pv-empty .big { font-size: 34px; margin-bottom: 10px; }
  .ws-login { display: none; position: fixed; inset: 0; z-index: 100; align-items: center; justify-content: center; background: var(--bg); flex-direction: column; gap: 14px; }
  .ws-login .card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 30px 34px; display: flex; flex-direction: column; gap: 12px; min-width: 280px; }
  .ws-login .card input { background: var(--panel-2); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 10px 12px; font-size: 13px; outline: none; }
  .ws-login .card input:focus { border-color: var(--accent); }
  .ws-login .card button { background: linear-gradient(135deg, var(--accent), var(--accent-deep)); border: none; color: #0b0c0f; border-radius: 8px; padding: 10px; font-weight: 700; cursor: pointer; font-size: 13px; }
  .ws-login .err { color: var(--red); font-size: 12px; min-height: 16px; }
  .ft-item { cursor: pointer; }
</style>
</head>
<body>
  <!-- 自鉴权登录层 -->
  <div class="ws-login" id="ws-login">
    <div class="card">
      <div style="font-size:15px;font-weight:700;color:var(--text)">📦 工作空间</div>
      <input id="ws-token-input" type="password" placeholder="访问令牌" autocomplete="off">
      <div class="err" id="ws-login-err"></div>
      <button id="ws-login-btn">连接</button>
    </div>
  </div>

  <div class="w-top" id="ws-app" style="display:none">
    <a class="back" href="/">← 返回工作台</a>
    <span class="title">📦 工作空间</span>
    <button class="ws-btn" id="ws-new-proj" title="新建项目">＋ 新建项目</button>
    <button class="ws-btn" id="ws-git-btn" title="Git 状态">⎇ Git</button>
    <button class="ws-btn" id="ws-refresh" title="刷新">↻ 刷新</button>
    <div class="spacer"></div>
    <span class="status" id="ws-status">…</span>
  </div>

  <div class="ws-body" id="ws-main" style="display:none">
    <div class="ws-side" id="ws-side">
      <div class="ws-search-wrap"><input id="ws-search" placeholder="🔍 搜索工作空间文件…" autocomplete="off"></div>
      <div id="ws-search-results"></div>
      <div id="ws-tree"><div class="fp-empty">加载中…</div></div>
    </div>
    <div class="ws-resizer" id="ws-resizer"></div>
    <div class="ws-preview">
      <div class="pv-head" id="pv-head" hidden>
        <span class="pv-title" id="pv-title">…</span>
        <span class="pv-meta" id="pv-meta">…</span>
        <div class="pv-actions">
          <button class="ws-btn" id="pv-edit" title="就地编辑">✏️ 编辑</button>
          <button class="ws-btn" id="pv-convert" title="转 Markdown">🔄 转MD</button>
          <button class="ws-btn" id="pv-deliver" title="一键交付">📦 交付</button>
          <button class="ws-btn" id="pv-download" title="下载">⬇</button>
          <button class="ws-btn" id="pv-delete" title="删除" style="color:var(--red)">🗑</button>
        </div>
      </div>
      <div class="pv-body" id="pv-body">
        <div class="pv-empty"><div><div class="big">📦</div>从左侧选择文件预览<br>支持 文本 / Markdown / 图片 / 音频 / 视频 / PDF / Office</div></div>
      </div>
    </div>
  </div>

  <!-- Git 面板 -->
  <div class="modal-overlay" id="git-modal">
    <div class="modal" style="width:620px;max-width:94vw">
      <div class="modal-head">
        <span>⎇ Git 状态</span>
        <button class="close" id="git-close">✕</button>
      </div>
      <div class="modal-tabs" style="display:flex;gap:8px;padding:10px 16px 0">
        <button class="ws-btn" id="git-tab-status">状态</button>
        <button class="ws-btn" id="git-tab-diff">Diff</button>
      </div>
      <pre id="git-output" style="margin:12px 16px 16px;padding:12px;background:var(--panel-2);border:1px solid var(--border);border-radius:10px;font-size:12px;font-family:var(--mono);color:var(--dim);white-space:pre-wrap;word-break:break-all;max-height:60vh;overflow:auto"></pre>
    </div>
  </div>

<script>
// ══ 独立页基础：token + API + 基础工具（页面自鉴权）══
let token = new URLSearchParams(location.search).get("token") || localStorage.getItem("pi_web_token") || "";
const $ = id => document.getElementById(id);
async function api(path, opts = {}) {
  opts.headers = { ...(opts.headers || {}), Authorization: "Bearer " + token };
  if (opts.body && typeof opts.body === "object") { opts.headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(opts.body); }
  const r = await fetch(path, opts);
  const ct = r.headers.get("content-type") || "";
  const data = ct.includes("json") ? await r.json() : null;
  if (!r.ok) { const e = new Error((data && data.error) || "HTTP " + r.status); e.status = r.status; throw e; }
  return data;
}
function esc(s) { return String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
let toastTimer = null;
function toast(msg) {
  let t = document.getElementById("ws-toast");
  if (!t) {
    t = document.createElement("div");
    t.id = "ws-toast";
    t.style.cssText = "position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--panel-2);border:1px solid var(--border);border-radius:10px;padding:10px 18px;font-size:13px;color:var(--text);z-index:400;box-shadow:0 10px 30px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .25s";
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity = "1";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.style.opacity = "0", 2200);
}
function appPrompt(msg, def = "", title = "输入") {
  return new Promise((resolve) => {
    const v = window.prompt(title + "：" + msg, def);
    resolve(v);
  });
}
function appConfirm(msg, title = "确认") { return Promise.resolve(window.confirm(title + "\n\n" + msg)); }
function fmtSize(n) {
  if (n < 1024) return `${n} B`;
  if (n < 1024*1024) return `${(n/1024).toFixed(1)} KB`;
  return `${(n/1024/1024).toFixed(2)} MB`;
}
function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }
function blobToBase64(blob) { return new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(",")[1]); fr.onerror = rej; fr.readAsDataURL(blob); }); }

// 登录鉴权
async function tryConnect() {
  try {
    await api("/api/models");
    $("ws-login").style.display = "none";
    $("ws-app").style.display = "flex";
    $("ws-main").style.display = "flex";
    loadWsTree();
  } catch {
    $("ws-login").style.display = "flex";
  }
}
$("ws-login-btn").addEventListener("click", async () => {
  const v = $("ws-token-input").value.trim();
  if (!v) return;
  token = v;
  localStorage.setItem("pi_web_token", v);
  try { await api("/api/models"); location.reload(); }
  catch { $("ws-login-err").textContent = "令牌无效"; }
});
$("ws-token-input").addEventListener("keydown", (e) => { if (e.key === "Enter") $("ws-login-btn").click(); });
tryConnect();

// ══ 工作空间：分类目录树 ══
const WS_ICONS = { "工程": "🏗", "生成物": "🖼", "文档": "📄", "交付": "📦", "外网分享": "📡", "收发文件": "📥" };
const WS_CATEGORIES = [
  { name: "工程", icon: "🏗", match: (n) => n === "工程" },
  { name: "文档", icon: "📄", match: (n) => n === "文档" },
  { name: "生成物", icon: "🖼", match: (n) => n === "生成物" },
  { name: "交付", icon: "📦", match: (n) => n === "交付" },
  { name: "外网分享", icon: "📡", match: (n) => n === "外网分享" },
  { name: "收发文件", icon: "📥", match: (n) => n === "收发文件" },
];
let collapsedGroups = {};
try { collapsedGroups = JSON.parse(localStorage.getItem("pi_collapsed") || "{}"); } catch {}
function toggleGroup(key) {
  collapsedGroups[key] = !collapsedGroups[key];
  try { localStorage.setItem("pi_collapsed", JSON.stringify(collapsedGroups)); } catch {}
  loadWsTree();
}
function wsGroup(gkey) {
  const collapsed = !!collapsedGroups[gkey];
  const g = document.createElement("div");
  g.className = "sess-group";
  g.innerHTML = `
    <div class="sg-head"><span class="sg-arrow">${collapsed ? "▸" : "▾"}</span><span class="sg-name"></span><span class="sg-count"></span></div>
    <div class="sg-body" ${collapsed ? "hidden" : ""}></div>`;
  g.querySelector(".sg-head").addEventListener("click", () => toggleGroup(gkey));
  return g;
}
async function loadWsTree() {
  const box = $("ws-tree");
  box.innerHTML = '<div class="fp-empty">加载中…</div>';
  try {
    const root = await api("/api/ws/tree");
    box.innerHTML = "";
    const dirs = root.items.filter(i => i.type === "dir");
    const files = root.items.filter(i => i.type === "file");
    let rendered = 0;
    for (const cat of WS_CATEGORIES) {
      const items = dirs.filter(d => cat.match(d.name));
      if (!items.length) continue;
      const g = wsGroup("ws-" + cat.name);
      g.querySelector(".sg-name").textContent = cat.icon + " " + cat.name;
      g.querySelector(".sg-count").textContent = items.length;
      const body = g.querySelector(".sg-body");
      for (const it of items) body.appendChild(wsItem(it, 0));
      box.appendChild(g);
      rendered++;
    }
    const otherDirs = dirs.filter(d => !WS_CATEGORIES.some(c => c.match(d.name)));
    if (otherDirs.length) {
      const g = wsGroup("ws-其他");
      g.querySelector(".sg-name").textContent = "📁 其他";
      g.querySelector(".sg-count").textContent = otherDirs.length;
      const body = g.querySelector(".sg-body");
      for (const it of otherDirs) body.appendChild(wsItem(it, 0));
      box.appendChild(g);
      rendered++;
    }
    if (files.length) {
      const g = wsGroup("ws-根文件");
      g.querySelector(".sg-name").textContent = "📄 根目录文件";
      g.querySelector(".sg-count").textContent = files.length;
      const body = g.querySelector(".sg-body");
      for (const it of files) body.appendChild(wsItem(it, 0));
      box.appendChild(g);
      rendered++;
    }
    if (!rendered) box.innerHTML = '<div class="fp-empty">工作空间为空</div>';
  } catch { box.innerHTML = '<div class="fp-empty">加载失败</div>'; }
}
function wsItem(it, depth) {
  const el = document.createElement("div");
  el.className = "ft-item " + it.type;
  el.style.paddingLeft = (8 + depth * 14) + "px";
  const isDir = it.type === "dir";
  el.innerHTML = `<span class="ft-arrow">${isDir ? "▸" : ""}</span><span class="ft-ico">${isDir ? (WS_ICONS[it.name] || "📁") : "📄"}</span><span class="ft-name">${esc(it.name)}</span>`;
  if (isDir) {
    const childBox = document.createElement("div");
    childBox.hidden = true;
    el.addEventListener("click", async (e) => {
      e.stopPropagation();
      const willExpand = childBox.hidden;
      el.querySelector(".ft-arrow").textContent = willExpand ? "▾" : "▸";
      childBox.hidden = !willExpand;
      if (willExpand) {
        childBox.innerHTML = '<div class="fp-empty">…</div>';
        try {
          const data = await api("/api/ws/tree?path=" + encodeURIComponent(it.path));
          childBox.innerHTML = "";
          const sorted = [...data.items].sort((a, b) => (a.type === "dir" ? 0 : 1) - (b.type === "dir" ? 0 : 1));
          for (const sub of sorted) childBox.appendChild(wsItem(sub, depth + 1));
        } catch { childBox.innerHTML = '<div class="fp-empty">加载失败</div>'; }
      }
    });
    el.appendChild(childBox);
  } else {
    el.addEventListener("click", (e) => { e.stopPropagation(); openWsFile(it); });
  }
  return el;
}

// ══ 文件预览 ══
let currentPreviewFile = null;
async function openWsFile(it) {
  currentPreviewFile = it.path;
  const ext = (it.name.split(".").pop() || "").toLowerCase();
  const url = "/api/ws/file?path=" + encodeURIComponent(it.path) + "&token=" + encodeURIComponent(token);
  const head = $("pv-head"), body = $("pv-body");
  head.hidden = false;
  $("pv-title").textContent = "📄 " + it.name;
  $("pv-meta").textContent = it.path;
  if (["png","jpg","jpeg","gif","webp","bmp"].includes(ext)) {
    body.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;min-height:100%"><img src="${url}" style="max-width:100%;max-height:calc(100dvh - 130px);border-radius:10px;border:1px solid var(--border)"></div>`;
    return;
  }
  if (["wav","mp3","ogg","m4a"].includes(ext)) {
    body.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;min-height:100%"><audio src="${url}" controls style="width:80%"></audio></div>`;
    return;
  }
  if (["mp4","webm","mov"].includes(ext)) {
    body.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;min-height:100%"><video src="${url}" controls style="max-width:100%;max-height:calc(100dvh - 130px);border-radius:10px"></video></div>`;
    return;
  }
  if (ext === "pdf") {
    body.innerHTML = `<iframe src="${url}" style="width:100%;height:calc(100dvh - 130px);border:none;border-radius:8px;background:#fff"></iframe>`;
    return;
  }
  if (["docx","xlsx","pptx"].includes(ext)) {
    try {
      body.innerHTML = '<div class="fp-empty">解析文档…</div>';
      const blob = await (await fetch(url)).blob();
      const b64 = await blobToBase64(blob);
      const r = await api("/api/parse-file", { method: "POST", body: { name: it.name, base64: b64 } });
      $("pv-meta").textContent = it.path + " · " + (r.text?.length || 0) + " 字符";
      body.innerHTML = `<pre>${esc(r.text || "（无文本内容）")}</pre>`;
      return;
    } catch { body.innerHTML = '<div class="fp-empty">无法解析该文档</div>'; return; }
  }
  try {
    const data = await api("/api/ws/read?path=" + encodeURIComponent(it.path));
    $("pv-meta").textContent = it.path + " · " + data.content.length + " 字符";
    if (ext === "md") { body.innerHTML = `<div class="markdown">${renderSimpleMd(data.content)}</div>`; }
    else { body.innerHTML = `<pre>${esc(data.content)}</pre>`; }
  } catch { body.innerHTML = '<div class="fp-empty">无法预览该文件（二进制？）</div>'; }
}
function renderSimpleMd(md) {
  const escMd = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const lines = String(md || "").split("\n");
  let html = "", inCode = false, codeBuf = [], inList = false;
  const closeList = () => { if (inList) { html += "</ul>"; inList = false; } };
  for (const line of lines) {
    if (/^```/.test(line.trim())) {
      if (inCode) { html += `<pre><code>${escMd(codeBuf.join("\n"))}</code></pre>`; codeBuf = []; inCode = false; }
      else { closeList(); inCode = true; }
      continue;
    }
    if (inCode) { codeBuf.push(line); continue; }
    if (/^#{1,6} /.test(line)) { closeList(); const n = line.match(/^(#+) /)[1].length; html += `<h${n}>${escMd(line.slice(n + 1))}</h${n}>`; }
    else if (/^\s*[-*] /.test(line)) { if (!inList) { html += "<ul>"; inList = true; } html += `<li>${escMd(line.replace(/^\s*[-*] /, ""))}</li>`; }
    else if (/^> /.test(line)) { closeList(); html += `<blockquote>${escMd(line.slice(2))}</blockquote>`; }
    else if (line.trim() === "") { closeList(); }
    else { closeList(); html += `<p>${escMd(line)}</p>`; }
  }
  if (inCode) html += `<pre><code>${escMd(codeBuf.join("\n"))}</code></pre>`;
  closeList();
  return html;
}

// ══ 预览操作：编辑/下载/交付/删除/转换 ══
let fvEditing = false;
$("pv-edit").addEventListener("click", async () => {
  if (!currentPreviewFile) return;
  const body = $("pv-body");
  const ext = currentPreviewFile.split(".").pop().toLowerCase();
  if (["png","jpg","jpeg","gif","webp","bmp","wav","mp3","ogg","m4a","mp4","webm","mov","pdf"].includes(ext)) {
    return toast("该类型不支持就地编辑");
  }
  if (!fvEditing) {
    fvEditing = true;
    $("pv-edit").textContent = "💾 保存";
    body.contentEditable = "true";
    body.style.outline = "2px solid var(--accent)";
    body.focus();
    toast("编辑后点击 💾 保存");
  } else {
    const newContent = body.innerText || body.textContent || "";
    try {
      const r = await api("/api/ws/write", { method: "POST", body: { path: currentPreviewFile, content: newContent } });
      toast(r.ok ? "✅ 已保存" : "保存失败: " + (r.error || ""));
    } catch { toast("保存失败"); }
    fvEditing = false;
    $("pv-edit").textContent = "✏️ 编辑";
    body.contentEditable = "false";
    body.style.outline = "";
  }
});
$("pv-download").addEventListener("click", () => {
  if (!currentPreviewFile) return;
  const url = "/api/ws/file?path=" + encodeURIComponent(currentPreviewFile) + "&token=" + encodeURIComponent(token) + "&download=1";
  const a = document.createElement("a");
  a.href = url; a.download = currentPreviewFile.split("/").pop();
  document.body.appendChild(a); a.click(); a.remove();
  toast("⬇ 已开始下载");
});
$("pv-deliver").addEventListener("click", async () => {
  if (!currentPreviewFile) return;
  const base = currentPreviewFile.split("/").pop() || "交付物";
  const name = await appPrompt("交付名称（自动版本递增）:", base, "交付");
  if (name === false) return;
  try {
    const r = await api("/api/ws/deliver", { method: "POST", body: { sourcePath: currentPreviewFile, name: name || base } });
    toast(r.ok ? `✅ 已交付 → 交付/${r.path.split("/").pop()}` : "交付失败: " + (r.error || ""));
  } catch { toast("交付失败"); }
});
$("pv-delete").addEventListener("click", async () => {
  if (!currentPreviewFile) return;
  if (!await appConfirm("确定删除 " + currentPreviewFile + " ？", "删除")) return;
  try {
    const r = await api("/api/ws/delete", { method: "POST", body: { path: currentPreviewFile, confirmed: true } });
    if (r.ok) { toast("🗑 已删除"); $("pv-head").hidden = true; $("pv-body").innerHTML = '<div class="pv-empty"><div><div class="big">📦</div>文件已删除</div></div>'; loadWsTree(); }
    else toast("删除失败: " + (r.error || ""));
  } catch { toast("删除失败"); }
});
$("pv-convert").addEventListener("click", async () => {
  if (!currentPreviewFile) return;
  try {
    const r = await api("/api/ws/convert", { method: "POST", body: { path: currentPreviewFile } });
    if (r.markdown) {
      $("pv-meta").textContent = currentPreviewFile + " · 转换结果 (Markdown)";
      $("pv-body").innerHTML = `<div class="markdown">${renderSimpleMd(r.markdown)}</div>`;
      toast("✅ 转换成功");
    } else toast("转换失败: " + (r.error || ""));
  } catch { toast("转换失败"); }
});

// ══ 新建项目 / 刷新 / 搜索 ══
$("ws-new-proj").addEventListener("click", async () => {
  const name = await appPrompt("项目名称：", "", "新建项目");
  if (!name) return;
  try {
    const r = await api("/api/ws/projects", { method: "POST", body: { name } });
    toast(r.ok ? "✅ 项目已创建 → " + r.path : "创建失败: " + (r.error || ""));
    if (r.ok) loadWsTree();
  } catch { toast("创建失败"); }
});
$("ws-refresh").addEventListener("click", () => { loadWsTree(); toast("已刷新"); });
let wsSearchTimer;
$("ws-search").addEventListener("input", (e) => {
  clearTimeout(wsSearchTimer);
  const q = e.target.value.trim();
  const box = $("ws-search-results");
  if (q.length < 2) { box.innerHTML = ""; return; }
  wsSearchTimer = setTimeout(async () => {
    try {
      const d = await api("/api/ws/search?q=" + encodeURIComponent(q));
      box.innerHTML = d.results.length ? "" : '<div class="fp-empty" style="padding:6px 10px">无结果</div>';
      for (const r of d.results.slice(0, 30)) {
        const el = document.createElement("div");
        el.className = "ws-search-item";
        el.innerHTML = `📄 ${esc(r.name)} <span class="ws-search-path">${esc(r.path)}</span>`;
        el.addEventListener("click", () => openWsFile({ name: r.name, path: r.path }));
        box.appendChild(el);
      }
    } catch { box.innerHTML = '<div class="fp-empty">搜索失败</div>'; }
  }, 300);
});

// ══ Git 面板 ══
let gitTab = "status";
async function openGit(tab) {
  gitTab = tab || "status";
  $("git-tab-status").classList.toggle("active", gitTab === "status");
  $("git-tab-diff").classList.toggle("active", gitTab === "diff");
  $("git-modal").classList.add("show");
  const out = $("git-output");
  out.textContent = "加载中…";
  try {
    const { isRepo, output } = await api("/api/git/" + gitTab);
    if (!isRepo) { out.textContent = "当前工作目录不是 Git 仓库（或 git 未安装）。"; return; }
    const lines = output.split("\n");
    out.innerHTML = lines.map(l => {
      if (l.startsWith("+") || l.startsWith("A") || l.startsWith("M ")) return `<span class="green">${esc(l)}</span>`;
      if (l.startsWith("-") || l.startsWith("D") || l.startsWith("!!")) return `<span class="red">${esc(l)}</span>`;
      if (l.startsWith("??")) return `<span class="yellow">${esc(l)}</span>`;
      if (l.startsWith("##")) return `<b>${esc(l)}</b>`;
      return esc(l);
    }).join("\n") || "（干净，无改动）";
  } catch (e) { out.textContent = "Git 出错: " + e.message; }
}
$("ws-git-btn").addEventListener("click", () => openGit("status"));
$("git-close").addEventListener("click", () => $("git-modal").classList.remove("show"));
$("git-modal").addEventListener("click", (e) => { if (e.target === $("git-modal")) $("git-modal").classList.remove("show"); });
$("git-tab-status").addEventListener("click", () => openGit("status"));
$("git-tab-diff").addEventListener("click", () => openGit("diff"));

// ══ 侧栏拖拽调宽（记忆）══
(function () {
  const resizer = $("ws-resizer");
  if (!resizer) return;
  let startX = 0, startW = 0, dragging = false;
  const side = () => $("ws-side");
  const KEY = "pi_ws_side_w";
  try {
    const saved = parseInt(localStorage.getItem(KEY) || "300", 10);
    if (saved >= 200 && saved <= 520) side().style.width = saved + "px";
  } catch {}
  resizer.addEventListener("mousedown", (e) => {
    e.preventDefault();
    dragging = true;
    resizer.classList.add("dragging");
    startX = e.clientX;
    startW = side().offsetWidth;
    document.body.style.cursor = "col-resize";
    document.body.style.userSelect = "none";
  });
  window.addEventListener("mousemove", (e) => {
    if (!dragging) return;
    const w = Math.min(520, Math.max(200, startW + (e.clientX - startX)));
    side().style.width = w + "px";
  });
  window.addEventListener("mouseup", () => {
    if (!dragging) return;
    dragging = false;
    resizer.classList.remove("dragging");
    document.body.style.cursor = "";
    document.body.style.userSelect = "";
    try { localStorage.setItem(KEY, String(side().offsetWidth)); } catch {}
  });
})();
</script>
