<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>◉ OMEGA · 多 Agent 工作台</title>
<link rel="icon" href="/static/icon-192.png">
<link rel="stylesheet" href="/static/app.css">
<link rel="stylesheet" href="/static/css/quantum.css">
<style>
  /* ===== OMEGA 多 Agent 工作台 · 复用 pi-web 主题体系 ===== */
  body { height: 100dvh; overflow: hidden; display: flex; flex-direction: column; margin: 0; }
  .omega { display: flex; flex: 1; min-height: 0; }

  /* ── 顶栏 ── */
  .w-top { display: flex; align-items: center; gap: 12px; padding: 10px 18px;
    border-bottom: 1px solid var(--border);
    background: color-mix(in srgb, var(--bg) 82%, transparent);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    flex-shrink: 0; position: relative; }
  .w-top::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 1px;
    background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--accent) 35%, transparent) 30%, color-mix(in srgb, var(--accent-2, var(--accent)) 35%, transparent) 70%, transparent); pointer-events: none; }
  .w-top .back { background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 6px 12px; font-size: 12.5px; cursor: pointer; text-decoration: none; }
  .w-top .back:hover { border-color: var(--accent); color: var(--accent); }
  .w-top .title { font-size: 15px; font-weight: 700; color: var(--text); letter-spacing: 1px; }
  .w-top .title b { color: var(--accent); }
  .w-top .spacer { flex: 1; }
  .w-top .status { font-size: 11.5px; color: var(--dim-2); font-family: var(--mono); display: flex; align-items: center; gap: 6px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
  .dot.on { background: var(--green); box-shadow: 0 0 8px color-mix(in srgb, var(--green) 70%, transparent); }
  .dot.off { background: var(--red); box-shadow: 0 0 8px color-mix(in srgb, var(--red) 60%, transparent); }

  /* ── 左栏：频道/成员 ── */
  .side { width: 210px; flex-shrink: 0; background: color-mix(in srgb, var(--bg) 92%, transparent);
    border-right: 1px solid var(--border); padding: 14px 10px; display: flex; flex-direction: column; gap: 4px; overflow-y: auto; }
  .sec { font-size: 10.5px; color: var(--dim-2); letter-spacing: 2px; margin: 10px 8px 6px; font-family: var(--mono); }
  .chan { display: flex; align-items: center; gap: 9px; padding: 8px 10px; border-radius: 8px; cursor: pointer;
    font-size: 13px; color: var(--dim); transition: all .15s; }
  .chan:hover { background: color-mix(in srgb, var(--accent) 7%, var(--panel)); color: var(--text); }
  .chan.on { background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 15%, transparent), transparent 80%);
    color: var(--text); border-left: 2px solid var(--accent); }
  .chan .hash { color: var(--accent); opacity: .75; }
  .mem { display: flex; align-items: center; gap: 9px; padding: 7px 10px; border-radius: 8px; font-size: 12.5px; }
  .mem .av { width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 12px; background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 80%, #000), color-mix(in srgb, var(--accent-2, #9d6cff) 80%, #000)); }
  .mem .name { flex: 1; color: var(--text); }
  .mem .dot { width: 6px; height: 6px; }

  /* ── 中栏：聊天 ── */
  .chat { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .chat-hd { padding: 12px 20px; border-bottom: 1px solid var(--hairline); display: flex; align-items: baseline; gap: 10px; flex-shrink: 0; }
  .chat-hd h2 { font-size: 14px; color: var(--text); }
  .chat-hd .sub { font-size: 11.5px; color: var(--dim-2); font-family: var(--mono); }
  .msgs { flex: 1; overflow-y: auto; padding: 20px 22px; display: flex; flex-direction: column; gap: 14px; }
  .msg { display: flex; gap: 10px; max-width: 74%; animation: fadeUp .22s ease; }
  .msg.me { align-self: flex-end; flex-direction: row-reverse; }
  .msg .av { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0;
    background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 75%, #000), color-mix(in srgb, var(--accent-2, #9d6cff) 75%, #000)); }
  .msg .body { min-width: 0; }
  .msg .meta { font-size: 10.5px; color: var(--dim-2); margin-bottom: 3px; display: flex; gap: 8px; font-family: var(--mono); }
  .msg.me .meta { justify-content: flex-end; }
  .msg .bub { padding: 9px 13px; border-radius: 12px; font-size: 13px; line-height: 1.65; word-break: break-word; }
  .msg.me .bub { background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 22%, var(--panel)), color-mix(in srgb, var(--accent) 12%, var(--panel)));
    border: 1px solid color-mix(in srgb, var(--accent) 30%, var(--border)); border-top-right-radius: 3px; }
  .msg.other .bub { background: var(--panel); border: 1px solid var(--border); border-top-left-radius: 3px; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
  .typing { display: flex; gap: 4px; padding: 3px 0; }
  .typing i { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); animation: blink 1.2s infinite; }
  .typing i:nth-child(2) { animation-delay: .2s; } .typing i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%,80%,100% { opacity: .2; } 40% { opacity: 1; } }

  .inp { padding: 12px 20px 16px; border-top: 1px solid var(--hairline); flex-shrink: 0; }
  .inp-box { display: flex; gap: 10px; align-items: flex-end; background: var(--panel);
    border: 1px solid var(--border); border-radius: 12px; padding: 9px 12px; transition: border-color .15s, box-shadow .15s; }
  .inp-box:focus-within { border-color: color-mix(in srgb, var(--accent) 55%, var(--border)); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 12%, transparent); }
  .inp-box textarea { flex: 1; background: transparent; border: none; outline: none; resize: none;
    color: var(--text); font-family: var(--sans); font-size: 13px; max-height: 110px; line-height: 1.55; }
  .send { background: linear-gradient(135deg, var(--accent), var(--accent-2, var(--accent-deep)));
    border: none; color: #fff; font-size: 12.5px; font-weight: 600; padding: 8px 18px; border-radius: 9px; cursor: pointer; transition: opacity .15s, transform .1s; }
  .send:hover { opacity: .9; transform: translateY(-1px); }
  .send:disabled { opacity: .4; cursor: not-allowed; }

  /* ── 右栏：Agent 面板 ── */
  .agents { width: 264px; flex-shrink: 0; background: color-mix(in srgb, var(--bg) 92%, transparent);
    border-left: 1px solid var(--border); padding: 14px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
  .ptitle { font-size: 10.5px; letter-spacing: 2px; color: var(--dim-2); font-family: var(--mono); }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 13px; padding: 13px;
    box-shadow: 0 4px 18px rgba(0,0,0,.22); }
  .card .hd { display: flex; align-items: center; gap: 9px; }
  .card .av { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 15px;
    background: linear-gradient(135deg, var(--accent-2, #9d6cff), color-mix(in srgb, var(--accent) 60%, #000)); }
  .card .nm { font-size: 13px; font-weight: 700; color: var(--text); }
  .card .rl { font-size: 10.5px; color: var(--dim-2); font-family: var(--mono); }
  .pill { margin-left: auto; font-size: 9.5px; padding: 3px 8px; border-radius: 999px; letter-spacing: 1px; font-weight: 700; font-family: var(--mono); }
  .pill.IDLE { background: var(--panel-2); color: var(--dim-2); }
  .pill.THINKING { background: color-mix(in srgb, var(--yellow) 15%, transparent); color: var(--yellow); }
  .pill.RUNNING { background: color-mix(in srgb, var(--green) 15%, transparent); color: var(--green); }
  .pill.COMPLETED { background: color-mix(in srgb, var(--accent) 15%, transparent); color: var(--accent); }
  .pill.ERROR { background: color-mix(in srgb, var(--red) 15%, transparent); color: var(--red); }
  .card .task { margin-top: 9px; font-size: 11.5px; color: var(--dim); word-break: break-word; line-height: 1.5; }
  .card .pb { margin-top: 8px; height: 3px; border-radius: 3px; background: var(--panel-2); overflow: hidden; }
  .card .pb i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2, var(--accent-deep))); transition: width .4s ease; }
  .card .mt { margin-top: 9px; display: flex; gap: 12px; font-size: 10.5px; color: var(--dim-2); font-family: var(--mono); }
  .tl { display: flex; flex-direction: column; gap: 5px; }
  .tl-i { display: flex; gap: 7px; font-size: 11px; color: var(--dim); animation: fadeUp .18s ease; line-height: 1.4; }
  .tl-i .t { color: var(--accent); font-family: var(--mono); flex-shrink: 0; }
  .tl-i .tag { opacity: .6; flex-shrink: 0; }

  /* 遮罩 */
  .mask { position: fixed; inset: 0; z-index: 99; display: flex; flex-direction: column; gap: 14px;
    align-items: center; justify-content: center; background: color-mix(in srgb, var(--bg) 94%, transparent); backdrop-filter: blur(10px); }
  .mask .ring { width: 38px; height: 38px; border: 3px solid color-mix(in srgb, var(--accent) 18%, transparent);
    border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .mask .txt { font-size: 12.5px; color: var(--dim); }

  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--accent) 30%, var(--panel-2)); border-radius: 3px; }
  ::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>

<div class="w-top">
  <a class="back" href="/">◈ 返回工作台</a>
  <span class="title">◉ OM<span style="color:var(--accent)">EGA</span> · 多 Agent 工作台</span>
  <span class="spacer"></span>
  <span class="status" id="conn"><span class="dot off"></span> 连接中…</span>
</div>

<div class="omega">
  <!-- 左栏 -->
  <div class="side">
    <div class="sec">CHANNELS</div>
    <div class="chan on"><span class="hash">#</span> Agent Room</div>
    <div class="chan"><span class="hash">#</span> 研发</div>
    <div class="chan"><span class="hash">#</span> 小说</div>
    <div class="sec">MEMBERS</div>
    <div class="mem"><div class="av">🧑</div><div class="name">你</div><span class="dot on"></span></div>
    <div class="mem"><div class="av">🤖</div><div class="name">小语</div><span class="dot on"></span></div>
  </div>

  <!-- 中栏 -->
  <div class="chat">
    <div class="chat-hd"><h2># Agent Room</h2><span class="sub">你 + 小语 · 实时群聊</span></div>
    <div class="msgs" id="msgs"></div>
    <div class="inp">
      <div class="inp-box">
        <textarea id="input" rows="1" placeholder="发消息给小语…（Enter 发送 / Shift+Enter 换行）"></textarea>
        <button class="send" id="sendBtn">发送</button>
      </div>
    </div>
  </div>

  <!-- 右栏 -->
  <div class="agents">
    <div class="ptitle">AGENT NETWORK</div>
    <div class="card">
      <div class="hd">
        <div class="av">🧠</div>
        <div><div class="nm">小语</div><div class="rl">AI 工作伙伴 · deepseek</div></div>
        <span class="pill IDLE" id="pill">IDLE</span>
      </div>
      <div class="task" id="task">等待任务…</div>
      <div class="pb"><i id="pb" style="width:0%"></i></div>
      <div class="mt"><span id="m1">回复 0</span><span id="m2">tokens 0</span></div>
    </div>
    <div class="ptitle">EVENT TIMELINE</div>
    <div class="tl" id="tl"></div>
  </div>
</div>

<div class="mask" id="mask"><div class="ring"></div><div class="txt">正在连接 OpenIM…</div></div>

<script>
// SDK 用 Cache Storage 缓存 wasm，清掉旧响应（MIME 错误版本）
if ('caches' in window) { caches.keys().then(ks => ks.forEach(k => caches.delete(k))); }
</script>
<script src="/static/wasm_exec.js"></script>
<script type="module" src="/static/omega-app.js"></script>
<script>
// ══ 主题同步：复用主工作台主题（不引 theme.js）══
(function () {
  const VARS = {
    quantum: {
      "--bg": "#070b16", "--bg-2": "#0a1020", "--panel": "rgba(18,26,48,.72)", "--panel-2": "rgba(10,16,32,.9)",
      "--text": "#dfe7ff", "--dim": "#7c89ad", "--dim-2": "#59647f",
      "--accent": "#23e6ff", "--accent-2": "#6f8bff", "--accent-deep": "#4a5fd0", "--accent-glow": "rgba(35,230,255,.35)",
      "--border": "rgba(104,140,255,.14)", "--hairline": "rgba(104,140,255,.10)", "--hairline-strong": "rgba(104,140,255,.18)",
      "--green": "#3df5b0", "--red": "#ff5d7a", "--yellow": "#ffc44d",
      "--radius": "12px", "--mono": "Consolas,'Courier New',monospace", "--sans": "'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif",
    },
    nebula: {
      "--bg": "#0a0e1a", "--bg-2": "#0f1526", "--panel": "rgba(18,26,48,.72)", "--panel-2": "rgba(10,16,32,.9)",
      "--text": "#dbe4ff", "--dim": "#7a86a8", "--dim-2": "#59647f",
      "--accent": "#6c8cff", "--accent-2": "#9d6cff", "--accent-deep": "#5a6be0", "--accent-glow": "rgba(108,140,255,.35)",
      "--border": "rgba(99,130,255,.16)", "--hairline": "rgba(99,130,255,.10)", "--hairline-strong": "rgba(99,130,255,.18)",
      "--green": "#38f5d0", "--red": "#ff5d7a", "--yellow": "#ffc44d",
      "--radius": "12px", "--mono": "Consolas,'Courier New',monospace", "--sans": "'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif",
    },
  };
  const key = localStorage.getItem("pi_theme") || "quantum";
  const vars = VARS[key] || VARS.quantum;
  const root = document.documentElement;
  for (const [k, v] of Object.entries(vars)) root.style.setProperty(k, v);
  root.dataset.theme = key;
})();
</script>
</body>
</html>
