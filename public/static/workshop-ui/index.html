<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>界面工坊 · M3E 草图板</title>
<link rel="stylesheet" href="css/workshop.css">
</head>
<body>
<div id="app">
  <!-- 顶栏 -->
  <header class="topbar">
    <div class="brand">◧ 界面工坊 <span class="sub">M3E 草图板 v0.1</span></div>
    <div class="topbar-actions">
      <button id="btn-preview" class="btn ghost" title="预览模式：可点按交互">▶ 预览</button>
      <button id="btn-tidy" class="btn ghost" title="对齐整理：栏贴边、栅格吸附">✨ 整理</button>
      <button id="btn-export" class="btn primary" title="生成给 AI 编码工具的提示词">⇪ 导出 Prompt</button>
    </div>
  </header>

  <div class="workspace">
    <!-- 左：组件面板 -->
    <aside class="panel left" id="palette">
      <div class="panel-title">组件</div>
      <div id="palette-list" class="palette-list"></div>
    </aside>

    <!-- 中：画布区 -->
    <main class="canvas-area" id="canvas-area">
      <div class="screen-tabs" id="screen-tabs"></div>
      <div class="canvas-holder" id="canvas-holder">
        <div class="phone-frame" id="phone-frame">
          <div class="phone-screen" id="phone-screen"></div>
          <div class="phone-notch"></div>
        </div>
      </div>
      <div class="hint" id="hint">拖左边的组件进屏幕 · 点选后可拖动/改文字 · Delete 删除</div>
    </main>

    <!-- 右：主题 + 属性 -->
    <aside class="panel right">
      <div class="panel-title">主题</div>
      <div class="theme-block">
        <div class="row">
          <label>种子色</label>
          <input type="color" id="seed-color" value="#6750A4">
        </div>
        <div class="row presets" id="seed-presets"></div>
        <div class="row">
          <label>深色模式</label>
          <input type="checkbox" id="dark-mode">
        </div>
      </div>
      <div class="panel-title">属性 <span id="sel-type" class="sel-type"></span></div>
      <div id="inspector" class="inspector">
        <div class="empty">未选中组件</div>
      </div>
      <div class="panel-title">屏幕</div>
      <div class="theme-block">
        <div class="row">
          <input id="screen-name" class="text-input" placeholder="屏幕名">
          <button id="btn-add-screen" class="btn ghost small">+ 加屏幕</button>
        </div>
      </div>
    </aside>
  </div>

  <!-- 导出弹窗 -->
  <div class="modal-mask" id="modal-mask">
    <div class="modal">
      <div class="modal-head">
        <span>导出 Prompt · 粘贴给 Claude Code / Codex / Cursor</span>
        <button id="btn-close-modal" class="btn ghost small">✕</button>
      </div>
      <textarea id="prompt-out" readonly spellcheck="false"></textarea>
      <div class="modal-foot">
        <button id="btn-copy" class="btn primary">复制</button>
      </div>
    </div>
  </div>

  <!-- 预览提示条 -->
  <div class="snackbar" id="snackbar"></div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
